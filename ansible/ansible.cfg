[defaults]
inventory = inventory/hosts.yml
roles_path = roles
remote_user = ops
host_key_checking = True
interpreter_python = auto_silent
callback_result_format = yaml

[ssh_connection]
pipelining = True
# Keepalive na conexão SSH reaproveitada (ControlPersist). Comandos longos sem saída (zpool wait, fio,
# apt) deixam a conexão ociosa; um firewall no caminho (provavelmente) a derrubou sem avisar e o Ansible, e os comandos
# seguintes na mesma conexão, ficavam pendurados para sempre (26/10/2026). Com keepalive, a conexão
# não fica ociosa, e se cair o ssh percebe em ~1 min e falha em vez de travar.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4
