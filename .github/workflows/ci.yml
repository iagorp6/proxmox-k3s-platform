name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dir: [terraform, terraform-aws]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform init (sem backend)
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate -no-color
      - name: Install tflint (versão fixa, SHA-256 conferido)
        run: |
          bash "$GITHUB_WORKSPACE/scripts/install-ci-tools.sh" "$HOME/bin" tflint
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: tflint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  ansible:
    name: Ansible lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install ansible-lint
        run: pip install --quiet ansible-lint==26.9.0
      - name: ansible-lint
        run: ansible-lint

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform e promtool (versão fixa, SHA-256 conferido)
        run: |
          bash scripts/install-ci-tools.sh "$HOME/bin" kubeconform promtool
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install PyYAML (leitura do catálogo de jogos)
        run: sudo apt-get install -y -qq python3-yaml >/dev/null
      - name: Validate every game in the catalog (kustomize)
        run: |
          set -o pipefail
          for dir in $(python3 scripts/catalog.py dirs); do
            echo "== $dir"
            kubectl kustomize "$dir" | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
      - name: Validate monitoring manifests
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            k8s/monitoring/alerts-homelab.yaml k8s/monitoring/alerts-games.generated.yaml k8s/monitoring/dashboard-asunboid.yaml
      - name: Alert rules (anotações obrigatórias, promtool check e testes unitários)
        run: python3 scripts/test-alerts.py
      - name: Dashboard YAML in sync with generator
        run: |
          python3 scripts/build-dashboard.py
          git diff --exit-code k8s/monitoring/dashboard-asunboid.yaml
      - name: Validate Grafana dashboard JSON
        run: |
          python3 - <<'PY'
          import json, re
          s = open("k8s/monitoring/dashboard-asunboid.yaml").read()
          body = s.split("  asunboid.json: |\n", 1)[1]
          dash = json.loads("\n".join(l[4:] if l.startswith("    ") else l for l in body.splitlines()))
          print(f"OK: '{dash['title']}' com {len(dash['panels'])} painéis")
          PY

  scripts:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Game platform
        run: |
          sudo apt-get install -y -qq python3-yaml >/dev/null
          python3 scripts/render-games.py --check
          bash scripts/check-minecraft-pin.sh
      - name: shellcheck
        run: shellcheck scripts/*.sh k8s/monitoring/deploy.sh

      - name: Python syntax
        run: python3 -m py_compile k8s/zomboid/exporter/*.py k8s/games/*/scripts/*.py scripts/*.py

  security:
    name: Security scan (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Trivy (versão fixa, SHA-256 conferido)
        run: |
          bash scripts/install-ci-tools.sh "$HOME/bin" trivy
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Secret scan (falha o build)
        run: trivy fs --scanners secret --exit-code 1 --no-progress .
      - name: Misconfiguration report (informativo)
        run: trivy config --severity HIGH,CRITICAL --exit-code 0 .
