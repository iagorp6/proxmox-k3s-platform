name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dir: [terraform, terraform-aws]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform init (sem backend)
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate -no-color
      - uses: terraform-linters/setup-tflint@v6
      - name: tflint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  ansible:
    name: Ansible lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ansible-lint
        run: pip install --quiet ansible-lint==26.9.0
      - name: ansible-lint
        run: ansible-lint

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz -C "$HOME/bin" kubeconform
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Validate zomboid (kustomize)
        run: |
          kubectl kustomize k8s/zomboid | kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Validate terraria (kustomize)
        run: |
          kubectl kustomize k8s/games/terraria | kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Validate minecraft (kustomize)
        run: |
          kubectl kustomize k8s/games/minecraft | kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Validate monitoring manifests
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            k8s/monitoring/alerts-homelab.yaml k8s/monitoring/dashboard-asunboid.yaml
      - name: Dashboard YAML in sync with generator
        run: |
          python3 scripts/build-dashboard.py
          git diff --exit-code k8s/monitoring/dashboard-asunboid.yaml
      - name: Validate Grafana dashboard JSON
        run: |
          python3 - <<'PY'
          import json, re
          s = open("k8s/monitoring/dashboard-asunboid.yaml").read()
          body = s.split("  asunboid.json: |\n", 1)[1]
          dash = json.loads("\n".join(l[4:] if l.startswith("    ") else l for l in body.splitlines()))
          print(f"OK: '{dash['title']}' com {len(dash['panels'])} painéis")
          PY

  scripts:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Game platform
        run: |
          sudo apt-get install -y -qq python3-yaml >/dev/null
          python3 scripts/render-games.py --check
      - name: shellcheck
        run: shellcheck scripts/*.sh k8s/monitoring/deploy.sh

      - name: Python syntax
        run: python3 -m py_compile k8s/zomboid/exporter/*.py k8s/games/terraria/scripts/*.py k8s/games/minecraft/scripts/*.py scripts/*.py

  security:
    name: Security scan (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Trivy
        run: |
          mkdir -p "$HOME/bin"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Secret scan (falha o build)
        run: trivy fs --scanners secret --exit-code 1 --no-progress .
      - name: Misconfiguration report (informativo)
        run: trivy config --severity HIGH,CRITICAL --exit-code 0 .
