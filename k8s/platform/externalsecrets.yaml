# Webhook do Discord usado pelo resumo semanal e pelos avisos do scripts/switch-game.py
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-webhook
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: discord-webhook
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: /homelab/monitoring/discord-webhook-url
---
# Bot do Discord que troca o jogo pelo painel do #games (ADR 0006): token do bot e deploy key
# com escrita só neste repositório (o bot commita a troca, como o scripts/switch-game.py)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: games-bot
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: games-bot
    creationPolicy: Owner
  data:
    - secretKey: discord-token
      remoteRef:
        key: /homelab/discord/bot-token
    - secretKey: deploy-key
      remoteRef:
        key: /homelab/github/games-bot-deploy-key
