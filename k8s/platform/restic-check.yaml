# Manutenção semanal do repositório restic (todos os jogos dividem o mesmo repositório no S3).
# O backup diário só escreve e marca snapshots velhos (forget). Aqui roda o prune, uma vez por semana
# em vez de três por dia (lock exclusivo que atrasava o backup do jogo seguinte), e depois o check:
# corrupção em pack ou índice só apareceria no restore.
# --read-data-subset baixa 5% dos packs, sorteados a cada execução: em poucos meses o repositório
# inteiro foi lido, e o egress do S3 fica em centavos.
# Por último confere o tamanho do repositório contra REPO_SIZE_LIMIT_GB: é o que gera custo no S3, e
# substitui o alarme do CloudWatch (o e-mail do SNS expirava sem confirmação e quebrava o drift).
# O bucket guarda ainda as versões não correntes por backup_noncurrent_days, então fica um pouco acima.
# Qualquer falha vira o alerta ResticCheckFailed no Discord.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-check
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: restic-check
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: /homelab/backup/restic-repository
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: /homelab/backup/restic-password
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /homelab/backup/restic-aws-access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /homelab/backup/restic-aws-secret-access-key
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: /homelab/backup/aws-region
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-check
  namespace: platform
spec:
  # Domingo de madrugada: longe dos backups (05:15 a 05:45) e da janela de patch (segunda 04:30)
  schedule: "0 3 * * 0"
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800   # o Job de falha fica uma semana para ler o log
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              # Mesma imagem do backup (platform/defaults.yaml); o Renovate atualiza as duas no mesmo PR
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  restic snapshots --compact
                  restic prune --retry-lock 30m
                  restic check --read-data-subset=5% --retry-lock 30m
                  size=$(restic stats --mode raw-data --json --retry-lock 30m | sed -n 's/.*"total_size":\([0-9]*\).*/\1/p')
                  [ -n "$size" ] || { echo "ERRO: não consegui ler o tamanho do repositório"; exit 1; }
                  limit=$((REPO_SIZE_LIMIT_GB * 1024 * 1024 * 1024))
                  echo "repositório: $((size / 1048576)) MiB (limite ${REPO_SIZE_LIMIT_GB} GiB)"
                  [ "$size" -le "$limit" ] || { echo "ERRO: repositório acima de ${REPO_SIZE_LIMIT_GB} GiB: confira o forget/prune ou suba o limite"; exit 1; }
              envFrom:
                - secretRef:
                    name: restic-check
              env:
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: TMPDIR
                  value: /tmp
                - name: REPO_SIZE_LIMIT_GB
                  value: "15"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: cache
                  mountPath: /cache
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: cache
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
