installCRDs: true
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
# externalsecret_status_condition para o alerta ExternalSecretNotReady. honorLabels mantém o
# namespace do ExternalSecret no label namespace (sem ele viraria exported_namespace)
serviceMonitor:
  enabled: true
  honorLabels: true
