# Sync MANUAL: mudanças no StatefulSet reiniciam o servidor do jogo; o operador escolhe a hora
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zomboid
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:iagorp6/proxmox-k3s-platform.git
    targetRevision: main
    path: k8s/zomboid
  destination:
    server: https://kubernetes.default.svc
    namespace: zomboid
