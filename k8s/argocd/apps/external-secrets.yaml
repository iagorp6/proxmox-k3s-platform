# External Secrets Operator + ClusterSecretStore aws-ssm (ADR 0007). Sync automático (ADR 0009): todo
# Secret do cluster depende dele; upgrade de chart passa pelo CI e o ExternalSecretNotReady avisa se quebrar.
# A credencial aws-ssm-credentials continua sendo criada à mão no bootstrap (não vem do Git).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.11.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/k8s/external-secrets/values-external-secrets.yaml
    - repoURL: git@github.com:iagorp6/proxmox-k3s-platform.git
      targetRevision: main
      ref: values
    # ClusterSecretStore (sync-wave 1: entra depois dos CRDs e do webhook do chart)
    - repoURL: git@github.com:iagorp6/proxmox-k3s-platform.git
      targetRevision: main
      path: k8s/external-secrets
      directory:
        include: cluster-secret-store.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  # O cert-controller do ESO grava o caBundle do webhook e da conversão dos CRDs em runtime
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions: [".spec.conversion.webhook.clientConfig.caBundle"]
  syncPolicy:
    # Auto-sync (ADR 0009): o CI já renderiza e valida o chart com estes values (check-charts.py).
    # prune desligado: recurso que some numa versão nova do chart fica OutOfSync (ArgoAppOutOfSync avisa)
    # e é removido num Sync manual com prune, olhando o que sai.
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true   # no primeiro sync o CRD do ClusterSecretStore ainda não existe
