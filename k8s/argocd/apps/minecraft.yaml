# Gerado por scripts/render-games.py a partir de game.yaml: não edite à mão.
# Sync MANUAL: quem liga e desliga é o scripts/switch-game.py
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:iagorp6/proxmox-k3s-platform.git
    targetRevision: main
    path: k8s/games/minecraft
  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft
