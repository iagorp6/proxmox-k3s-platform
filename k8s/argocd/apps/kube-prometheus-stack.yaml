# Prometheus, Alertmanager, Grafana e operator (ADR 0007). Sync automático (ADR 0009): atualização de
# chart chega por PR do Renovate e entra no cluster no merge, depois de passar no CI.
# releaseName "kps" mantém os nomes dos recursos criados pelo antigo `helm upgrade --install kps`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: monitoring
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.8.2
      helm:
        releaseName: kps
        valueFiles:
          - $values/k8s/monitoring/values-kube-prometheus-stack.yaml
    - repoURL: git@github.com:iagorp6/proxmox-k3s-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # O job de admission do operator grava o caBundle depois do sync; sem isto o app fica OutOfSync
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
  syncPolicy:
    # Auto-sync (ADR 0009): o CI já renderiza e valida o chart com estes values (check-charts.py).
    # prune desligado: recurso que some numa versão nova do chart fica OutOfSync (ArgoAppOutOfSync avisa)
    # e é removido num Sync manual com prune, olhando o que sai.
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
    syncOptions:
      - ServerSideApply=true   # CRDs do operator passam do limite de 256 KiB da annotation do apply client-side
      - RespectIgnoreDifferences=true
