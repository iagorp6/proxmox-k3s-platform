# Alloy: coleta os logs dos pods e envia ao Loki. Sync automático, como o kube-prometheus-stack (ADR 0009).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: monitoring
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.0
      helm:
        releaseName: alloy
        valueFiles:
          - $values/k8s/monitoring/values-alloy.yaml
    - repoURL: git@github.com:iagorp6/proxmox-k3s-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    # Auto-sync (ADR 0009): o CI já renderiza e valida o chart com estes values (check-charts.py).
    # prune desligado: recurso que some numa versão nova do chart fica OutOfSync (ArgoAppOutOfSync avisa)
    # e é removido num Sync manual com prune, olhando o que sai.
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
    syncOptions:
      - ServerSideApply=true
