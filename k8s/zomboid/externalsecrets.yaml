apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zomboid-secrets
  namespace: zomboid
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: zomboid-secrets
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: /homelab/zomboid/admin-password
    - secretKey: server-password
      remoteRef:
        key: /homelab/zomboid/server-password
    - secretKey: rcon-password
      remoteRef:
        key: /homelab/zomboid/rcon-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zomboid-backup
  namespace: zomboid
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: zomboid-backup
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: /homelab/backup/restic-repository
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: /homelab/backup/restic-password
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /homelab/backup/restic-aws-access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /homelab/backup/restic-aws-secret-access-key
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: /homelab/backup/aws-region
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-webhook
  namespace: zomboid
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: discord-webhook
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: /homelab/monitoring/discord-webhook-url
