apiVersion: batch/v1
kind: CronJob
metadata:
  name: zomboid-backup
  namespace: zomboid
spec:
  schedule: "30 5 * * *"
  timeZone: "America/Sao_Paulo"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          serviceAccountName: zomboid-ops
          restartPolicy: Never
          initContainers:
            - name: save-world
              image: curlimages/curl:latest@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              command: ["/bin/sh", "-c"]
              args:
                - |
                  curl -fsSLo /tmp/kubectl https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl && chmod +x /tmp/kubectl
                  /tmp/kubectl -n zomboid exec zomboid-0 -c server -- sh -c 'echo save > /tmp/console' || echo "server not running, backing up last save"
                  sleep 30
          containers:
            - name: restic
              image: restic/restic:latest@sha256:9940e6c7421ab3a21ee9fdc4e91596d04c792b600d31b102696c75cbf3ac4481
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  restic cat config >/dev/null 2>&1 || restic init
                  restic backup /pz/data/Saves /pz/data/db /pz/data/Server --host k3s-01 --tag zomboid
                  restic forget --tag zomboid --keep-daily 7 --keep-weekly 4 --prune
                  restic snapshots --tag zomboid
              envFrom:
                - secretRef:
                    name: zomboid-backup
              volumeMounts:
                - name: data
                  mountPath: /pz
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: data-zomboid-0
                readOnly: true
