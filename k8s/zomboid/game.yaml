# Catálogo da plataforma. O Zomboid ainda usa manifests escritos à mão (status legacy): o
# render-games.py não gera nada para ele. Passa a "active" quando migrar para k8s/games/.
name: zomboid
displayName: Project Zomboid
status: legacy
memory: 10Gi
monitoring: rcon
namespace: zomboid
ports:
  - { name: game, port: 16261, protocol: UDP }
  - { name: direct, port: 16262, protocol: UDP }
switch:
  playersMetric: zomboid_players_online   # ainda fora do contrato game_*
  suspendWhenIdle: [zomboid-daily-restart]
