apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - statefulset.yaml
  - service.yaml
  - daily-restart.yaml
  - backup.yaml
  - metrics.yaml
  - externalsecrets.yaml
  - weekly-summary.yaml

# Código Python versionado como arquivo; o Kustomize gera os ConfigMaps
configMapGenerator:
  - name: zomboid-exporter
    files:
      - exporter.py=exporter/exporter.py
  - name: zomboid-weekly-summary
    files:
      - summary.py=exporter/weekly_summary.py
generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: replicas.yaml   # gerado por scripts/switch-game.py
