apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: /homelab/monitoring/grafana-admin-user
    - secretKey: admin-password
      remoteRef:
        key: /homelab/monitoring/grafana-admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: alertmanager-discord
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: /homelab/monitoring/discord-webhook-url
    # Canal #ops privado: alertas de infra (os críticos vão também para o webhook-url)
    - secretKey: ops-webhook-url
      remoteRef:
        key: /homelab/monitoring/discord-ops-webhook-url
    - secretKey: healthchecks-url
      remoteRef:
        key: /homelab/monitoring/healthchecks-watchdog-url
---
# Scrape do host Proxmox (node_exporter e smartctl_exporter instalados pelo Ansible). O IP do host
# fica no SSM, fora do Git (repositório público); o kube-prometheus-stack lê o Secret pronto via
# prometheusSpec.additionalScrapeConfigsSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-additional-scrape
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: prometheus-additional-scrape
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        scrape.yaml: |
          - job_name: proxmox-node
            static_configs:
              - targets: ["{{ .host }}:9100"]
                labels:
                  host: pve-01
          - job_name: proxmox-smartctl
            scrape_interval: 5m
            static_configs:
              - targets: ["{{ .host }}:9633"]
                labels:
                  host: pve-01
  data:
    - secretKey: host
      remoteRef:
        key: /homelab/monitoring/proxmox-host
