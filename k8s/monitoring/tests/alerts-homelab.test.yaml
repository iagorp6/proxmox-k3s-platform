rule_files: [alerts-homelab.yaml]
evaluation_interval: 1m
tests:
  - name: morte no PerkLog dispara PlayerDied com as horas sobrevividas; morte antiga nao
    interval: 1m
    input_series:
      # PlayerDied compara com time(): no promtool o relógio começa em 0, então o timestamp é em segundos de teste
      - series: 'game_player_last_death_timestamp_seconds{game="zomboid",player="iago"}'
        values: '0x2 300x10'        # morreu aos 5 min de teste
      - series: 'game_player_last_death_hours_survived{game="zomboid",player="iago"}'
        values: '0x2 34x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: PlayerDied
        exp_alerts:
          - exp_labels: {severity: info, notify: events, game: zomboid, player: iago}
            exp_annotations:
              summary: "💀 iago morreu"
              description: "O personagem sobreviveu 34 horas no jogo."
      - eval_time: 10m
        alertname: PlayerDied
        exp_alerts: []
  - name: marco de horas novo dispara PlayerMilestone uma vez
    interval: 1m
    input_series:
      - series: 'game_player_milestone_hours{game="zomboid",player="iago"}'
        values: '10x14 25x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: PlayerMilestone
        exp_alerts: []
      - eval_time: 16m
        alertname: PlayerMilestone
        exp_alerts:
          - exp_labels: {severity: info, notify: events, game: zomboid, player: iago}
            exp_annotations:
              summary: "🏆 iago completou 25 horas no servidor"
              description: "Tempo total jogado em zomboid."
      - eval_time: 30m
        alertname: PlayerMilestone
        exp_alerts: []
  - name: backup sem sucesso ha mais de 26h dispara BackupStale; backup em dia e outros CronJobs nao
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="minecraft",cronjob="minecraft-backup"}'
        values: '0x1700'            # último sucesso no instante zero: fica velho com o tempo
      - series: 'kube_cronjob_status_last_successful_time{namespace="terraria",cronjob="terraria-backup"}'
        values: '0+60x1700'         # sucesso sempre recente
      - series: 'kube_cronjob_status_last_successful_time{namespace="zomboid",cronjob="zomboid-daily-restart"}'
        values: '0x1700'            # não é backup: fora do alerta
    alert_rule_test:
      - eval_time: 25h
        alertname: BackupStale
        exp_alerts: []
      - eval_time: 27h
        alertname: BackupStale
        exp_alerts:
          - exp_labels: {severity: critical, namespace: minecraft, cronjob: minecraft-backup}
            exp_annotations:
              summary: "Sem backup bem-sucedido de minecraft há mais de 26h"
              description: "O CronJob minecraft-backup não tem sucesso registrado nas últimas 26 horas."
              action: "kubectl -n minecraft create job --from=cronjob/minecraft-backup backup-manual"
  - name: backup agendado que nunca teve sucesso dispara BackupLastRunFailed
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_schedule_time{namespace="minecraft",cronjob="minecraft-backup"}'
        values: '100x60'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="terraria",cronjob="terraria-backup"}'
        values: '100x60'
      - series: 'kube_cronjob_status_last_successful_time{namespace="terraria",cronjob="terraria-backup"}'
        values: '130x60'            # terminou com sucesso depois do agendamento
    alert_rule_test:
      - eval_time: 20m
        alertname: BackupLastRunFailed
        exp_alerts: []
      - eval_time: 35m
        alertname: BackupLastRunFailed
        exp_alerts:
          - exp_labels: {severity: critical, namespace: minecraft, cronjob: minecraft-backup}
            exp_annotations:
              summary: "Backup de minecraft falhou na última execução"
              description: "A execução mais recente do CronJob minecraft-backup não terminou com sucesso."
              action: "kubectl -n minecraft logs $(kubectl -n minecraft get jobs -o name --sort-by=.metadata.creationTimestamp | tail -1) --tail=30"
  - name: restart por falta de memoria dispara ContainerOOMKilled em qualquer namespace
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="monitoring",pod="grafana-0",container="grafana"}'
        values: '0x5 1x20'
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="monitoring",pod="grafana-0",container="grafana",reason="OOMKilled"}'
        values: '0x5 1x20'
      - series: 'kube_pod_container_status_restarts_total{namespace="argocd",pod="repo-0",container="repo"}'
        values: '0x5 1x20'          # reiniciou, mas não por memória
    alert_rule_test:
      - eval_time: 8m
        alertname: ContainerOOMKilled
        exp_alerts:
          - exp_labels: {severity: warning, namespace: monitoring, pod: grafana-0, container: grafana}
            exp_annotations:
              summary: "grafana (monitoring) morto por falta de memória"
              description: "O container foi OOMKilled nos últimos 15 minutos."
              action: "Comparar o uso com o limite e ajustar os resources no values ou no manifest."
  - name: host com menos de 1 GiB disponivel por 10 min dispara HostMemoryLow
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="proxmox-node",instance="pve"}'
        values: '4294967296x5 805306368x20'   # 4 GiB, depois 768 MiB
      - series: 'node_memory_MemAvailable_bytes{job="node-exporter",instance="k3s"}'
        values: '805306368x25'                # a VM com pouca RAM não é problema do host
    alert_rule_test:
      - eval_time: 10m
        alertname: HostMemoryLow
        exp_alerts: []
      - eval_time: 18m
        alertname: HostMemoryLow
        exp_alerts:
          - exp_labels: {severity: warning, job: proxmox-node, instance: pve}
            exp_annotations:
              summary: "Menos de 1 GiB de RAM disponível no host"
              description: "O host não tem swap. Se a memória acabar, o OOM killer do host derruba o processo da VM inteira."
              action: "ssh no host e rodar free -m; conferir o ARC (arc_summary -s arc) e o KSM (cat /sys/kernel/mm/ksm/pages_sharing)"
  - name: games-bot sem réplica disponível dispara GamesBotDown; com réplica, não
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="platform",deployment="games-bot"}'
        values: '1x20'
      - series: 'kube_deployment_status_replicas_available{namespace="platform",deployment="games-bot"}'
        values: '1x4 0x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: GamesBotDown
        exp_alerts: []
      - eval_time: 12m
        alertname: GamesBotDown
        exp_alerts: []
      - eval_time: 16m
        alertname: GamesBotDown
        exp_alerts:
          - exp_labels: {severity: warning, namespace: platform, deployment: games-bot}
            exp_annotations:
              summary: "Painel de jogos do Discord fora do ar"
              description: "O games-bot não tem réplica disponível há 10 minutos: o painel do #games não responde e a troca de jogo só funciona pelo make switch-game."
              action: "kubectl -n platform get pods -l app.kubernetes.io/name=games-bot e kubectl -n platform describe pod -l app.kubernetes.io/name=games-bot | tail -20"
  - name: patch de segurança pendente no host por mais de 7 dias dispara HostSecurityUpdatesPending
    interval: 1m                    # amostra a cada minuto: com 1h a série some entre amostras (lookback de 5m) e o for zera
    input_series:
      - series: 'apt_upgrades_pending{job="proxmox-node",instance="pve",origin="Debian:trixie-security/stable-security",arch="amd64"}'
        values: '2x12000'
      - series: 'apt_upgrades_pending{job="proxmox-node",instance="pve",origin="Proxmox:trixie/trixie",arch="amd64"}'
        values: '5x12000'             # pacote da Proxmox (não é -security): não conta
    alert_rule_test:
      - eval_time: 6d
        alertname: HostSecurityUpdatesPending
        exp_alerts: []
      - eval_time: 8d
        alertname: HostSecurityUpdatesPending
        exp_alerts:
          - exp_labels: {severity: warning, instance: pve}
            exp_annotations:
              summary: "Patches de segurança pendentes no host há mais de 7 dias"
              description: "2 pacote(s) de segurança do Debian sem instalar no host Proxmox."
              action: "No WSL, em ansible/: ansible-playbook playbooks/pve-upgrade.yml"
  - name: kernel novo sem reboot por mais de 7 dias dispara HostRebootPending; reboot zera
    interval: 1m                    # amostra a cada minuto: com 1h a série some entre amostras (lookback de 5m) e o for zera
    input_series:
      - series: 'node_reboot_required{job="proxmox-node",instance="pve"}'
        values: '0x14000'
      - series: 'homelab_kernel_reboot_pending{job="proxmox-node",instance="pve",running="6.14.8-2-pve",newest="6.14.11-1-pve"}'
        values: '1x12000 0x2000'     # reboot no dia ~8,3
    alert_rule_test:
      - eval_time: 6d
        alertname: HostRebootPending
        exp_alerts: []
      - eval_time: 8d
        alertname: HostRebootPending
        exp_alerts:
          - exp_labels: {severity: warning, instance: pve}
            exp_annotations:
              summary: "Host Proxmox com reboot pendente há mais de 7 dias"
              description: "Um kernel ou pacote novo só vale depois do reboot. O reboot do host derruba a VM e o jogo por alguns minutos."
              action: "Quando ninguém estiver jogando: ansible-playbook playbooks/pve-upgrade.yml -e pve_upgrade_reboot=true"
      - eval_time: 9d
        alertname: HostRebootPending
        exp_alerts: []
  - name: app do Argo CD Degraded alerta depois de 15 min; Healthy não
    interval: 1m
    input_series:
      - series: 'argocd_app_info{name="platform",autosync_enabled="true",health_status="Degraded",sync_status="Synced"}'
        values: '1x30'
      - series: 'argocd_app_info{name="zomboid",autosync_enabled="false",health_status="Healthy",sync_status="Synced"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: ArgoAppDegraded
        exp_alerts: []
      - eval_time: 20m
        alertname: ArgoAppDegraded
        exp_alerts:
          - exp_labels: {severity: warning, name: platform}
            exp_annotations:
              summary: "App platform do Argo CD está Degraded ou Missing"
              description: "O Argo CD aplicou o app, mas algum recurso dele não está saudável há 15 minutos."
              action: "kubectl -n argocd get application platform -o yaml | grep -B3 -A2 'status: Degraded\\|status: Missing'"
      - eval_time: 20m
        alertname: ArgoCDMetricsMissing
        exp_alerts: []
  - name: OutOfSync só alerta em app com auto-sync (jogos ficam OutOfSync até o Sync manual)
    interval: 1m
    input_series:
      - series: 'argocd_app_info{name="monitoring-config",autosync_enabled="true",health_status="Healthy",sync_status="OutOfSync"}'
        values: '1x40'
      - series: 'argocd_app_info{name="terraria",autosync_enabled="false",health_status="Healthy",sync_status="OutOfSync"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ArgoAppOutOfSync
        exp_alerts: []
      - eval_time: 35m
        alertname: ArgoAppOutOfSync
        exp_alerts:
          - exp_labels: {severity: warning, name: monitoring-config}
            exp_annotations:
              summary: "App monitoring-config com auto-sync não acompanha o main"
              description: "O app tem sync automático, mas está diferente do Git há 30 minutos: o último sync provavelmente falhou."
              action: "kubectl -n argocd get application monitoring-config -o jsonpath='{.status.operationState.message}'"
  - name: sem métrica do Argo CD alerta que os alertas de gitops estão cegos
    interval: 1m
    input_series:
      - series: 'up{job="node-exporter"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: ArgoCDMetricsMissing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Prometheus sem métricas do Argo CD"
              description: "Os alertas de app Degraded e OutOfSync estão cegos: o application-controller caiu ou o ServiceMonitor sumiu."
              action: "kubectl -n argocd get pods,servicemonitors e, se faltar o ServiceMonitor, make deploy-argocd"
  - name: ExternalSecret com Ready=False alerta; Ready=True não
    interval: 1m
    input_series:
      - series: 'externalsecret_status_condition{namespace="monitoring",name="prometheus-additional-scrape",condition="Ready",status="False"}'
        values: '1x30'
      - series: 'externalsecret_status_condition{namespace="monitoring",name="prometheus-additional-scrape",condition="Ready",status="True"}'
        values: '0x30'
      - series: 'externalsecret_status_condition{namespace="platform",name="games-bot",condition="Ready",status="False"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: ExternalSecretNotReady
        exp_alerts: []
      - eval_time: 20m
        alertname: ExternalSecretNotReady
        exp_alerts:
          - exp_labels: {severity: warning, namespace: monitoring, name: prometheus-additional-scrape}
            exp_annotations:
              summary: "ExternalSecret monitoring/prometheus-additional-scrape não sincroniza"
              description: "O Secret do cluster não está sendo atualizado a partir do SSM. Quase sempre é parâmetro faltando ou renomeado no SSM."
              action: "kubectl -n monitoring describe externalsecret prometheus-additional-scrape | tail -5 e, se faltar parâmetro, make secrets"
  - name: restic check sem sucesso depois do agendamento alerta; com sucesso não
    interval: 1m
    input_series:
      # Agendado em t=0, sem sucesso registrado (Job falhou ou ainda roda): o for de 3h dá tempo ao check longo
      - series: 'kube_cronjob_status_last_schedule_time{namespace="platform",cronjob="restic-check"}'
        values: '0x330'
      - series: 'kube_cronjob_status_last_successful_time{namespace="platform",cronjob="restic-check"}'
        values: '_x330'
    alert_rule_test:
      - eval_time: 2h
        alertname: ResticCheckFailed
        exp_alerts: []
      - eval_time: 4h
        alertname: ResticCheckFailed
        exp_alerts:
          - exp_labels: {severity: warning, namespace: platform, cronjob: restic-check}
            exp_annotations:
              summary: "Verificação semanal do repositório restic falhou"
              description: "O restic check não terminou com sucesso: pode haver pack ou índice corrompido no S3. Os backups diários seguem rodando, mas o restore pode falhar."
              action: "kubectl -n platform logs job/$(kubectl -n platform get jobs -o name --sort-by=.metadata.creationTimestamp | grep restic-check | tail -1 | cut -d/ -f2) --tail=40"
  - name: restic check que terminou logo depois do agendamento não alerta
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_schedule_time{namespace="platform",cronjob="restic-check"}'
        values: '0x330'
      - series: 'kube_cronjob_status_last_successful_time{namespace="platform",cronjob="restic-check"}'
        values: '1800x330'
    alert_rule_test:
      - eval_time: 5h
        alertname: ResticCheckFailed
        exp_alerts: []
