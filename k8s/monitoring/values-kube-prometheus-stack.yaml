# kube-prometheus-stack enxuto para K3s single-node

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

prometheus:
  prometheusSpec:
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 30d
    retentionSize: 8GB
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Scrape do host Proxmox: o ExternalSecret prometheus-additional-scrape (externalsecrets.yaml)
    # monta os jobs com o IP guardado no SSM, que não vai para o Git
    additionalScrapeConfigsSecret:
      enabled: true
      name: prometheus-additional-scrape
      key: scrape.yaml
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    # Monta o Secret em /etc/alertmanager/secrets/alertmanager-discord/
    secrets:
      - alertmanager-discord
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  config:
    global:
      resolve_timeout: 5m
    time_intervals:
      # Restart diário do servidor (CronJob das 6h): evita alerta falso de queda.
      # Jogos entram pela chave alerts.muteDuring do game.yaml (o render-games.py --check confere o nome)
      - name: restart-diario
        time_intervals:
          - times:
              - start_time: "05:55"
                end_time: "06:15"
            location: America/Sao_Paulo
      # Janela semanal de patch da VM (homelab-patch-reboot.timer, role auto_updates do Ansible):
      # se um patch pediu reboot, a VM reinicia segunda 04:30 e jogo, Prometheus e Alertmanager voltam
      # juntos. Alertas que seguem disparando depois das 05:15 notificam normalmente.
      - name: patch-semanal
        time_intervals:
          - weekdays: ["monday"]
            times:
              - start_time: "04:25"
                end_time: "05:15"
            location: America/Sao_Paulo
    # Dois canais: infra no #ops privado (webhook ops-webhook-url); o canal dos amigos (webhook-url) recebe
    # entradas, mortes, marcos e só as quedas que eles sentem (jogo fora ou host fora), sem os comandos de ação.
    # Repetição: crítico a cada 6h, warning uma vez por dia (antes 2h e 12h: um alerta travado enchia o canal).
    route:
      receiver: discord-ops
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 24h
      routes:
        # Dead man's switch: o Watchdog pinga o healthchecks.io; se parar, o healthchecks avisa
        - receiver: healthchecks
          matchers:
            - alertname = "Watchdog"
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
        # Entrada de jogadores (antes da regra de info). Sem mensagem de saída: a sessão fica no dashboard
        - receiver: discord-players
          matchers:
            - notify = "players"
          group_by: ["player"]
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 720h
        # Eventos do jogo (morte e marcos): uma mensagem por evento, sem "resolvido"
        - receiver: discord-events
          matchers:
            - notify = "events"
          group_by: ["alertname", "player"]
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 720h
        # info não notifica
        - receiver: "null"
          matchers:
            - severity = "info"
        # Alertas de jogo com alerts.muteDuring no catálogo: silêncio durante o restart diário
        # (mute_time_intervals não herda da rota pai, por isso as rotas irmãs)
        - receiver: discord-ops-and-friends
          matchers:
            - mute = "restart-diario"
            - alertname =~ "GameDown|GameUnresponsive"
          mute_time_intervals: ["restart-diario", "patch-semanal"]
          repeat_interval: 6h
        - receiver: discord-ops
          matchers:
            - mute = "restart-diario"
          mute_time_intervals: ["restart-diario", "patch-semanal"]
          repeat_interval: 6h
        # Queda que os jogadores sentem: #ops e canal dos amigos
        - receiver: discord-ops-and-friends
          matchers:
            - alertname =~ "GameDown|GameUnresponsive|HostDown"
          mute_time_intervals: ["patch-semanal"]
          repeat_interval: 6h
        # Resto do crítico (backup, disco, ZFS, ServiceLB...): só #ops
        - receiver: discord-ops
          matchers:
            - severity = "critical"
          mute_time_intervals: ["patch-semanal"]
          repeat_interval: 6h
        # Warning: só #ops, mesmo receiver da raiz, só para aplicar a janela de patch
        - receiver: discord-ops
          mute_time_intervals: ["patch-semanal"]
    inhibit_rules:
      - source_matchers: ["severity = critical"]
        target_matchers: ["severity = warning"]
        equal: ["alertname"]
      # Com o host fora, alertas que dependem dele ficam mudos
      - source_matchers: ["alertname = HostDown"]
        target_matchers: ['alertname =~ "DiskSmartFailing|DiskReallocatedSectors|ZfsPoolNotOnline|EccUncorrectableErrors|EccCorrectableErrorsHigh|HostDiskSpaceLow"']
      # Entrega ao Discord falhando (webhook apagado ou trocado): o Watchdog para de pingar o
      # healthchecks.io, que avisa pela integração própria dele. Sem isso o dead man's switch seguia
      # verde enquanto todo alerta falhava calado (o próprio AlertmanagerFailedToSendAlerts iria
      # para o Discord quebrado).
      - source_matchers: ["alertname = AlertmanagerFailedToSendAlerts", "integration = discord"]
        target_matchers: ["alertname = Watchdog"]
      # Com o jogo fora do ar, restart, memória e métricas do mesmo jogo não importam
      - source_matchers: ["alertname = GameDown"]
        target_matchers: ['alertname =~ "GameRestarted|GameMemoryHigh|GameExporterMissing"']
        equal: ["namespace"]
      # Crash do servidor do jogo: o GameRestarted já conta, sem repetir como OOM ou CrashLoop
      - source_matchers: ["alertname = GameRestarted"]
        target_matchers: ['alertname =~ "ContainerOOMKilled|KubePodCrashLooping"']
        equal: ["namespace"]
    receivers:
      - name: "null"
      - name: healthchecks
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-discord/healthchecks-url
            send_resolved: false
      # #ops: título com a severidade, descrição, comando de ação e quando começou
      - name: discord-ops
        discord_configs:
          - &ops-discord
            webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/ops-webhook-url
            send_resolved: true
            title: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}🔴{{ else }}🟠{{ end }} {{ or .CommonAnnotations.summary .CommonLabels.alertname }}{{ else }}✅ Resolvido: {{ or .CommonAnnotations.summary .CommonLabels.alertname }}{{ end }}'
            message: |-
              {{ range .Alerts }}{{ if eq .Status "firing" }}{{ .Annotations.description }}
              {{ with .Annotations.action }}`{{ . }}`
              {{ end }}Desde {{ .StartsAt | tz "America/Sao_Paulo" | date "02/01 15:04" }} · {{ .Labels.alertname }}{{ else }}Resolvido às {{ .EndsAt | tz "America/Sao_Paulo" | date "15:04" }}, depois de {{ (.EndsAt.Sub .StartsAt).Truncate 60000000000 }}{{ end }}
              {{ end }}
      # Canal dos amigos: só o que muda para quem joga, sem comando nem nome de alerta
      - name: discord-ops-and-friends
        discord_configs:
          - *ops-discord
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true
            title: '{{ if eq .Status "firing" }}🔴 {{ or .CommonAnnotations.summary "Servidor fora do ar" }}{{ else }}✅ Resolvido: {{ or .CommonAnnotations.summary "servidor no ar" }}{{ end }}'
            message: '{{ if eq .Status "firing" }}O admin já foi avisado. A mensagem de volta sai aqui.{{ else }}{{ with index .Alerts 0 }}Ficou fora por {{ (.EndsAt.Sub .StartsAt).Truncate 60000000000 }}.{{ end }}{{ end }}'
      - name: discord-events
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: false
            title: '{{ .CommonAnnotations.summary }}'
            message: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
      # Só a entrada; o cargo é mencionado apenas para quem abre o servidor (annotation ping da regra)
      - name: discord-players
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: false
            content: '{{ if eq .CommonAnnotations.ping "sim" }}<@&1555259172574986342>{{ end }}'
            title: '🟢 {{ .CommonLabels.player }} entrou no servidor'
            message: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  defaultDashboardsTimezone: America/Sao_Paulo
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
