# Severidades: critical = agir agora | warning = agir hoje | info = só registro (não notifica)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
spec:
  groups:
    - name: zomboid
      rules:
        - alert: ZomboidDown
          expr: zomboid_up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Servidor do jogo fora do ar"
            description: "O servidor não responde ao RCON há mais de 5 minutos. Os jogadores não conseguem entrar."
            action: "kubectl -n zomboid get pods e kubectl -n zomboid logs zomboid-0 -c server --tail=30"
        - alert: ZomboidExporterMissing
          expr: |
            absent(zomboid_up)
            and on() (kube_statefulset_replicas{namespace="zomboid",statefulset="zomboid"} > 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Sem métricas do servidor do jogo"
            description: "O pod do jogo não está sendo coletado: parado, Pending ou em crash."
            action: "kubectl -n zomboid describe pod zomboid-0 | tail -15"
        - alert: ZomboidRestarted
          expr: increase(kube_pod_container_status_restarts_total{namespace="zomboid",container="server"}[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Servidor do jogo reiniciou sozinho"
            description: "O processo do jogo caiu e o Kubernetes o reiniciou. Restarts planejados não disparam este alerta."
            action: "kubectl -n zomboid logs zomboid-0 -c server --previous --tail=40"
        - alert: ZomboidMemoryHigh
          expr: |
            max by (pod) (container_memory_working_set_bytes{namespace="zomboid",container="server"})
            / max by (pod) (kube_pod_container_resource_limits{namespace="zomboid",container="server",resource="memory"})
            > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Servidor do jogo perto do limite de memória"
            description: "Uso de {{ $value | humanizePercentage }} do limite. Risco de OOMKilled."
            action: "Comparar o pico no dashboard e avaliar subir PZ_XMX e o limite do StatefulSet."

    - name: backup
      rules:
        # Genéricas: valem para qualquer CronJob "<algo>-backup", em qualquer namespace de jogo
        - alert: BackupLastRunFailed
          expr: |
            (
              max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time{cronjob=~".+-backup"})
              - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{cronjob=~".+-backup"})
            ) > 3600
            or
            (
              max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time{cronjob=~".+-backup"})
              unless on (namespace, cronjob)
              kube_cronjob_status_last_successful_time{cronjob=~".+-backup"}
            )
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Backup de {{ $labels.namespace }} falhou na última execução"
            description: "A execução mais recente do CronJob {{ $labels.cronjob }} não terminou com sucesso."
            action: "kubectl -n {{ $labels.namespace }} logs $(kubectl -n {{ $labels.namespace }} get jobs -o name --sort-by=.metadata.creationTimestamp | tail -1) --tail=30"
        - alert: BackupStale
          expr: time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{cronjob=~".+-backup"}) > 26 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Sem backup bem-sucedido de {{ $labels.namespace }} há mais de 26h"
            description: "O CronJob {{ $labels.cronjob }} não tem sucesso registrado nas últimas 26 horas."
            action: "kubectl -n {{ $labels.namespace }} create job --from=cronjob/{{ $labels.cronjob }} backup-manual"

    - name: host
      rules:
        - alert: HostDown
          expr: up{job="proxmox-node"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Host Proxmox sem métricas"
            description: "O node_exporter do host não responde há 5 minutos. Alertas de disco, ZFS e ECC ficam suspensos enquanto isso."
            action: "Verificar o host pelo iLO/console e o serviço prometheus-node-exporter."
        - alert: DiskSmartFailing
          expr: smartctl_device_smart_status == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "SMART reprovado no disco {{ $labels.device }}"
            description: "Falha prevista. No ZFS RAID0, perder um disco é perder o pool inteiro."
            action: "Rodar um backup manual agora e planejar a troca do disco."
        - alert: DiskReallocatedSectors
          expr: smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"} > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Setores realocados no disco {{ $labels.device }}"
            description: "{{ $value }} setores realocados. Sinal precoce de desgaste."
            action: "Acompanhar a tendência; se o número crescer, planejar a troca."
        - alert: ZfsPoolNotOnline
          expr: node_zfs_zpool_state{state!="online"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pool ZFS {{ $labels.zpool }} em estado {{ $labels.state }}"
            description: "O pool não está ONLINE."
            action: "ssh no host e rodar zpool status -x"
        - alert: EccUncorrectableErrors
          expr: increase(node_edac_uncorrectable_errors_total[1h]) > 0
          labels:
            severity: critical
          annotations:
            summary: "Erro de memória não corrigido (ECC)"
            description: "Risco de corrupção de dados no host."
            action: "Verificar o IML no iLO e identificar o pente com edac-util -v."
        - alert: EccCorrectableErrorsHigh
          expr: increase(node_edac_correctable_errors_total[24h]) > 10
          labels:
            severity: warning
          annotations:
            summary: "Muitos erros de memória corrigidos (ECC)"
            description: "{{ $value }} erros corrigidos em 24h. Um pente pode estar com defeito."
            action: "Identificar o pente com edac-util -v e acompanhar."
        - alert: HostDiskSpaceLow
          expr: |
            (node_filesystem_avail_bytes{job="proxmox-node",fstype=~"zfs|ext4|vfat"}
            / node_filesystem_size_bytes{job="proxmox-node",fstype=~"zfs|ext4|vfat"}) < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pouco espaço em {{ $labels.mountpoint }} no host"
            description: "Menos de 15% livre."
            action: "ssh no host e rodar zfs list -o name,used,avail"

    - name: vm
      rules:
        - alert: VMDiskSpaceLow
          expr: |
            (node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"}
            / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"}) < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pouco espaço no disco da VM do K3s"
            description: "Menos de 15% livre em /. Mundo do jogo, Prometheus e Loki ficam nesse disco."
            action: "ssh na VM e rodar sudo du -xh --max-depth=2 /var/lib/rancher | sort -h | tail"

    - name: cluster
      rules:
        - alert: ServiceLBPortConflict
          expr: max by (pod) (kube_pod_status_phase{namespace="kube-system",pod=~"svclb-.*",phase="Pending"}) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ServiceLB sem porta livre: {{ $labels.pod }}"
            description: "O pod do ServiceLB não conseguiu reservar a porta no nó. O Service correspondente fica inacessível de fora."
            action: "kubectl -n kube-system describe pod {{ $labels.pod }} | tail -10 e conferir portas repetidas entre os Services"
        - alert: ContainerOOMKilled
          expr: |
            increase(kube_pod_container_status_restarts_total[15m]) > 0
            and on (namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.container }} ({{ $labels.namespace }}) morto por falta de memória"
            description: "O container foi OOMKilled nos últimos 15 minutos."
            action: "Comparar o uso com o limite e ajustar os resources no values ou no manifest."

    - name: terraria
      rules:
        - alert: TerrariaPlayerOnline
          expr: max by (player) (game_player_online{game="terraria"}) == 1
          labels:
            severity: info
            notify: players
          annotations:
            summary: "{{ $labels.player }} está online no Terraria"
            description: >-
              {{ with query "max(game_players_online{game='terraria'})" }}{{ . | first | value | printf "%.0f" }}{{ end }}/6 no Terraria:
              {{ range $i, $s := query "max by (player) (game_player_online{game='terraria'})" }}{{ if $i }}, {{ end }}{{ $s.Labels.player }}{{ end }}
        - alert: TerrariaDown
          expr: |
            kube_statefulset_replicas{namespace="terraria",statefulset="terraria"} > 0
            unless on (namespace, statefulset)
            kube_statefulset_status_replicas_ready{namespace="terraria",statefulset="terraria"} > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Servidor do Terraria fora do ar"
            description: "O Terraria é o jogo ativo, mas o pod não está pronto há mais de 10 minutos."
            action: "kubectl -n terraria get pods e kubectl -n terraria logs terraria-0 -c server --tail=30"

    - name: players
      rules:
        - alert: PlayerOnline
          expr: max by (player) (zomboid_player_online) == 1
          labels:
            severity: info
            notify: players
          annotations:
            summary: "{{ $labels.player }} está online"
            description: >-
              {{ with query "max(zomboid_players_online)" }}{{ . | first | value | printf "%.0f" }}{{ end }}/6 online:
              {{ range $i, $s := query "max by (player) (zomboid_player_online)" }}{{ if $i }}, {{ end }}{{ $s.Labels.player }}{{ end }}
        - alert: PlayerDied
          expr: (time() - max by (player) (zomboid_player_last_death_timestamp_seconds)) < 180
          labels:
            severity: info
            notify: events
          annotations:
            summary: "💀 {{ $labels.player }} morreu"
            description: >-
              {{ with query (printf "max(zomboid_player_last_death_hours_survived{player=%q})" $labels.player) }}O personagem sobreviveu {{ . | first | value | printf "%.0f" }} horas no jogo.{{ else }}Mais um para a horda.{{ end }}
        - alert: PlayerMilestone
          expr: max by (player) (zomboid_player_milestone_hours) > max by (player) (zomboid_player_milestone_hours offset 10m)
          labels:
            severity: info
            notify: events
          annotations:
            summary: "🏆 {{ $labels.player }} completou {{ $value | printf \"%.0f\" }} horas no servidor"
            description: "Tempo total jogado no AsunBoid."
