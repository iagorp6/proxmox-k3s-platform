# Severidades: critical = agir agora | warning = agir hoje | info = só registro (não notifica)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
spec:
  groups:
    - name: backup
      rules:
        # Genéricas: valem para qualquer CronJob "<algo>-backup", em qualquer namespace de jogo
        - alert: BackupLastRunFailed
          expr: |
            (
              max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time{cronjob=~".+-backup"})
              - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{cronjob=~".+-backup"})
            ) > 3600
            or
            (
              max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time{cronjob=~".+-backup"})
              unless on (namespace, cronjob)
              kube_cronjob_status_last_successful_time{cronjob=~".+-backup"}
            )
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Backup de {{ $labels.namespace }} falhou na última execução"
            description: "A execução mais recente do CronJob {{ $labels.cronjob }} não terminou com sucesso."
            action: "kubectl -n {{ $labels.namespace }} logs $(kubectl -n {{ $labels.namespace }} get jobs -o name --sort-by=.metadata.creationTimestamp | tail -1) --tail=30"
        - alert: BackupStale
          expr: time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{cronjob=~".+-backup"}) > 26 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Sem backup bem-sucedido de {{ $labels.namespace }} há mais de 26h"
            description: "O CronJob {{ $labels.cronjob }} não tem sucesso registrado nas últimas 26 horas."
            action: "kubectl -n {{ $labels.namespace }} create job --from=cronjob/{{ $labels.cronjob }} backup-manual"
        # Prune e verificação semanais do repositório (k8s/platform/restic-check.yaml): backup que não restaura não é backup
        - alert: ResticCheckFailed
          expr: |
            (
              max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time{namespace="platform",cronjob="restic-check"})
              - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace="platform",cronjob="restic-check"})
            ) > 3 * 3600
            or
            (
              max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time{namespace="platform",cronjob="restic-check"})
              unless on (namespace, cronjob)
              kube_cronjob_status_last_successful_time{namespace="platform",cronjob="restic-check"}
            )
          for: 3h
          labels:
            severity: warning
          annotations:
            summary: "Verificação semanal do repositório restic falhou"
            description: "O prune, o restic check ou a conferência de tamanho semanal não terminou com sucesso: pode haver pack ou índice corrompido no S3, o espaço de snapshots esquecidos não foi liberado, ou o repositório passou do limite de tamanho (REPO_SIZE_LIMIT_GB, o que pesa na conta da AWS). Os backups diários seguem rodando, mas o restore pode falhar."
            action: "kubectl -n platform logs job/$(kubectl -n platform get jobs -o name --sort-by=.metadata.creationTimestamp | grep restic-check | tail -1 | cut -d/ -f2) --tail=40"
        # Restore drill mensal de cada jogo (CronJob <jogo>-restore-drill, gerado pelo render-games.py).
        # Falha de uma execução cai no KubeJobFailed; aqui é o drill que parou de passar ou nunca passou.
        # O segundo ramo cobre o CronJob novo que nunca teve sucesso (kube_cronjob_created dá a idade).
        - alert: RestoreDrillStale
          expr: |
            time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{cronjob=~".+-restore-drill"}) > 35 * 86400
            or
            (
              time() - max by (namespace, cronjob) (kube_cronjob_created{cronjob=~".+-restore-drill"}) > 35 * 86400
              unless on (namespace, cronjob)
              kube_cronjob_status_last_successful_time{cronjob=~".+-restore-drill"}
            )
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Restore drill de {{ $labels.namespace }} sem sucesso há mais de 35 dias"
            description: "O backup de {{ $labels.namespace }} não foi restaurado e conferido no último mês: não há prova de que ele volta."
            action: "kubectl -n {{ $labels.namespace }} create job --from=cronjob/{{ $labels.cronjob }} drill-manual && kubectl -n {{ $labels.namespace }} logs -f job/drill-manual"

    - name: host
      rules:
        - alert: HostDown
          expr: up{job="proxmox-node"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Host Proxmox sem métricas"
            description: "O node_exporter do host não responde há 5 minutos. Alertas de disco, ZFS e ECC ficam suspensos enquanto isso."
            action: "Verificar o host pelo iLO/console e o serviço prometheus-node-exporter."
        - alert: DiskSmartFailing
          expr: smartctl_device_smart_status == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "SMART reprovado no disco {{ $labels.device }}"
            description: "Falha prevista. O pool é um mirror: se o disco morrer, o pool segue no outro, mas sem redundância até a troca."
            action: "Rodar um backup manual agora e trocar o disco seguindo docs/disk-replacement.md."
        - alert: DiskReallocatedSectors
          expr: smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"} > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Setores realocados no disco {{ $labels.device }}"
            description: "{{ $value }} setores realocados. Sinal precoce de desgaste."
            action: "Acompanhar a tendência; se o número crescer, planejar a troca."
        - alert: ZfsPoolNotOnline
          expr: node_zfs_zpool_state{state!="online"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pool ZFS {{ $labels.zpool }} em estado {{ $labels.state }}"
            description: "O pool não está ONLINE. DEGRADED no mirror = um disco fora: tudo funciona, mas o próximo disco perdido é o pool inteiro."
            action: "ssh no host, zpool status -x, e trocar o disco seguindo docs/disk-replacement.md."
        # Métricas homelab_zfs_* vêm do textfile homelab-zfs (role host_exporters, timer de 15 min)
        - alert: ZfsVdevErrors
          expr: max by (pool, vdev) (homelab_zfs_vdev_errors) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Erros no disco {{ $labels.vdev }} do pool {{ $labels.pool }}"
            description: "O zpool status mostra {{ $value }} erro(s) de leitura, escrita ou checksum. No mirror o ZFS corrige pelo outro disco, mas o pool continua ONLINE e o ZfsPoolNotOnline não dispara. Erro que volta depois de zpool clear é disco ou cabo falhando."
            action: "ssh no host: zpool status -v rpool e smartctl -a no disco. Se o SMART estiver limpo: zpool clear rpool e zpool scrub rpool; se os erros voltarem, docs/disk-replacement.md."
        - alert: ZfsDataErrors
          expr: max by (pool) (homelab_zfs_pool_data_errors) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Dados corrompidos no pool {{ $labels.pool }}"
            description: "{{ $value }} erro(s) de dados permanentes: blocos que nem o mirror conseguiu reparar. Os arquivos afetados (pode ser o disco da VM) estão danificados."
            action: "ssh no host: zpool status -v rpool lista os arquivos. Restaurar o jogo afetado com make restore-game GAME=<jogo> e trocar o disco com erros."
        - alert: ZfsScrubStale
          expr: time() - max by (pool) (homelab_zfs_last_scrub_timestamp_seconds) > 40 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Pool {{ $labels.pool }} sem scrub há mais de 40 dias"
            description: "O cron do zfsutils-linux faz scrub no segundo domingo de cada mês. Sem scrub, um bloco ruim só aparece quando for lido, e no mirror isso pode ser tarde demais para reparar pelo outro disco."
            action: "ssh no host: zpool scrub rpool, e conferir /etc/cron.d/zfsutils-linux ou o timer zfs-scrub-monthly@rpool."
        - alert: HostTextfileMetricsStale
          expr: time() - node_textfile_mtime_seconds{job="proxmox-node",file=~".*homelab-(kernel|zfs).prom"} > 3 * 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Métrica {{ $labels.file }} do host parou de atualizar"
            description: "O timer que escreve esse textfile não roda há mais de 3 horas, então os alertas que dependem dele (ZFS, kernel pendente) ficam cegos."
            action: "ssh no host: systemctl list-timers 'homelab-*' e journalctl -u homelab-zfs -u homelab-kernel-reboot -n 30."
        - alert: EccUncorrectableErrors
          expr: increase(node_edac_uncorrectable_errors_total[1h]) > 0
          labels:
            severity: critical
          annotations:
            summary: "Erro de memória não corrigido (ECC)"
            description: "Risco de corrupção de dados no host."
            action: "Verificar o IML no iLO e identificar o pente com edac-util -v."
        - alert: EccCorrectableErrorsHigh
          expr: increase(node_edac_correctable_errors_total[24h]) > 10
          labels:
            severity: warning
          annotations:
            summary: "Muitos erros de memória corrigidos (ECC)"
            description: "{{ $value }} erros corrigidos em 24h. Um pente pode estar com defeito."
            action: "Identificar o pente com edac-util -v e acompanhar."
        - alert: HostMemoryLow
          expr: node_memory_MemAvailable_bytes{job="proxmox-node"} < 1073741824
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Menos de 1 GiB de RAM disponível no host"
            description: "O host não tem swap. Se a memória acabar, o OOM killer do host derruba o processo da VM inteira."
            action: "ssh no host e rodar free -m; conferir o ARC (arc_summary -s arc) e o KSM (cat /sys/kernel/mm/ksm/pages_sharing)"
        - alert: HostDiskSpaceLow
          expr: |
            (node_filesystem_avail_bytes{job="proxmox-node",fstype=~"zfs|ext4|vfat"}
            / node_filesystem_size_bytes{job="proxmox-node",fstype=~"zfs|ext4|vfat"}) < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pouco espaço em {{ $labels.mountpoint }} no host"
            description: "Menos de 15% livre."
            action: "ssh no host e rodar zfs list -o name,used,avail"
        # Métricas do textfile collector (role host_exporters): o host não se atualiza sozinho
        - alert: HostSecurityUpdatesPending
          expr: sum by (instance) (apt_upgrades_pending{job="proxmox-node",origin=~".*-security.*"}) > 0
          for: 7d
          labels:
            severity: warning
          annotations:
            summary: "Patches de segurança pendentes no host há mais de 7 dias"
            description: "{{ $value }} pacote(s) de segurança do Debian sem instalar no host Proxmox."
            action: "No WSL, em ansible/: ansible-playbook playbooks/pve-upgrade.yml"
        - alert: HostRebootPending
          expr: |
            (max by (instance) (node_reboot_required{job="proxmox-node"}) > 0)
            or (max by (instance) (homelab_kernel_reboot_pending{job="proxmox-node"}) > 0)
          for: 7d
          labels:
            severity: warning
          annotations:
            summary: "Host Proxmox com reboot pendente há mais de 7 dias"
            description: "Um kernel ou pacote novo só vale depois do reboot. O reboot do host derruba a VM e o jogo por alguns minutos."
            action: "Quando ninguém estiver jogando: ansible-playbook playbooks/pve-upgrade.yml -e pve_upgrade_reboot=true"

    - name: vm
      rules:
        - alert: VMDiskSpaceLow
          expr: |
            (node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"}
            / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"}) < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pouco espaço no disco da VM do K3s"
            description: "Menos de 15% livre em /. Mundo do jogo, Prometheus e Loki ficam nesse disco."
            action: "ssh na VM e rodar sudo du -xh --max-depth=2 /var/lib/rancher | sort -h | tail"

    - name: cluster
      rules:
        - alert: ServiceLBPortConflict
          expr: max by (pod) (kube_pod_status_phase{namespace="kube-system",pod=~"svclb-.*",phase="Pending"}) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ServiceLB sem porta livre: {{ $labels.pod }}"
            description: "O pod do ServiceLB não conseguiu reservar a porta no nó. O Service correspondente fica inacessível de fora."
            action: "kubectl -n kube-system describe pod {{ $labels.pod }} | tail -10 e conferir portas repetidas entre os Services"
        - alert: ContainerOOMKilled
          expr: |
            increase(kube_pod_container_status_restarts_total[15m]) > 0
            and on (namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.container }} ({{ $labels.namespace }}) morto por falta de memória"
            description: "O container foi OOMKilled nos últimos 15 minutos."
            action: "Comparar o uso com o limite e ajustar os resources no values ou no manifest."
        # Aviso antes do OOM fora dos jogos (o GameMemoryHigh cobre o container server de cada jogo). Em 30/10 o
        # application-controller do Argo CD morreu com 768Mi e o único sinal foi o ContainerOOMKilled, depois do kill.
        - alert: ContainerMemoryNearLimit
          expr: |
            max by (namespace, pod, container) (container_memory_working_set_bytes{container!="",container!="POD",container!="server"})
            / on (namespace, pod, container)
            max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
            > 0.9
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.container }} ({{ $labels.namespace }}) perto do limite de memória"
            description: "Uso de {{ $value | humanizePercentage }} do limite há 30 minutos. Risco de OOMKilled."
            action: "kubectl -n {{ $labels.namespace }} top pod {{ $labels.pod }} --containers e subir o limite no values do chart ou no manifest (Argo CD: k8s/argocd/values-argocd.yaml + make deploy-argocd)"
        # Painel de troca de jogo (ADR 0006): sem o bot, ninguém além do admin troca o jogo
        - alert: GamesBotDown
          expr: |
            kube_deployment_spec_replicas{namespace="platform",deployment="games-bot"} > 0
            unless on (namespace, deployment)
            kube_deployment_status_replicas_available{namespace="platform",deployment="games-bot"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Painel de jogos do Discord fora do ar"
            description: "O games-bot não tem réplica disponível há 10 minutos: o painel do #games não responde e a troca de jogo só funciona pelo make switch-game."
            action: "kubectl -n platform get pods -l app.kubernetes.io/name=games-bot e kubectl -n platform describe pod -l app.kubernetes.io/name=games-bot | tail -20"

    # Reconciliação: sem isto, um app Degraded ou um Secret sem sincronizar só aparece quando alguém abre o Argo
    - name: gitops
      rules:
        - alert: ArgoAppDegraded
          expr: max by (name) (argocd_app_info{health_status=~"Degraded|Missing"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "App {{ $labels.name }} do Argo CD está Degraded ou Missing"
            description: "O Argo CD aplicou o app, mas algum recurso dele não está saudável há 15 minutos."
            action: "kubectl -n argocd get application {{ $labels.name }} -o yaml | grep -B3 -A2 'status: Degraded\\|status: Missing'"
        # Jogos têm Sync manual (o switch-game sincroniza): OutOfSync neles é o normal até a próxima troca
        - alert: ArgoAppOutOfSync
          expr: max by (name) (argocd_app_info{autosync_enabled="true",sync_status="OutOfSync"}) == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "App {{ $labels.name }} com auto-sync não acompanha o main"
            description: "O app tem sync automático, mas está diferente do Git há 30 minutos: o último sync provavelmente falhou."
            action: "kubectl -n argocd get application {{ $labels.name }} -o jsonpath='{.status.operationState.message}'"
        # O jogo ativo não tem autosync (um merge não pode reiniciar o servidor com gente jogando), então uma
        # whitelist ou um digest novo ficam no Git sem chegar ao servidor até alguém rodar o sync-game. Jogos
        # parados ficam de fora: eles só sincronizam no próximo switch-game.
        - alert: GameSyncPending
          expr: |
            max by (name) (argocd_app_info{project="games",sync_status="OutOfSync"}) == 1
            and on (name)
            label_replace(max by (namespace) (kube_statefulset_replicas) > 0, "name", "$1", "namespace", "(.+)")
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.name }} tem mudança no main que ainda não chegou ao servidor"
            description: "O app do jogo ativo está OutOfSync há 24 horas: algo mergeado (whitelist, imagem, config) espera o sync."
            action: "Com ninguém jogando: make sync-game GAME={{ $labels.name }}"
        - alert: ArgoCDMetricsMissing
          expr: absent(argocd_app_info)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus sem métricas do Argo CD"
            description: "Os alertas de app Degraded e OutOfSync estão cegos: o application-controller caiu ou o ServiceMonitor sumiu."
            action: "kubectl -n argocd get pods,servicemonitors e, se faltar o ServiceMonitor, make deploy-argocd"
        - alert: ExternalSecretNotReady
          expr: max by (namespace, name) (externalsecret_status_condition{condition="Ready",status="False"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} não sincroniza"
            description: "O Secret do cluster não está sendo atualizado a partir do SSM. Quase sempre é parâmetro faltando ou renomeado no SSM."
            action: "kubectl -n {{ $labels.namespace }} describe externalsecret {{ $labels.name }} | tail -5 e, se faltar parâmetro, make secrets"

    - name: games
      rules:
        # GameDown, GameRestarted e GameMemoryHigh (Zomboid incluso) são gerados do catálogo: alerts-games.generated.yaml
        # Genéricas: valem para todo jogo no contrato game_* (o Zomboid incluso; o antigo PlayerOnline saiu)
        - alert: GamePlayerOnline
          expr: max by (game, player) (game_player_online) == 1
          labels:
            severity: info
            notify: players
          annotations:
            summary: "{{ $labels.player }} está online em {{ $labels.game }}"
            # "sim" só para quem abriu o servidor (1 online): a menção do cargo no Discord sai uma vez por rodada de jogo
            ping: >-
              {{ with query (printf "max(game_players_online{game='%s'})" $labels.game) }}{{ if le (. | first | value) 1.0 }}sim{{ end }}{{ end }}
            description: >-
              {{ with query (printf "max(game_players_online{game='%s'})" $labels.game) }}{{ . | first | value | printf "%.0f" }}{{ end }}/6 em {{ $labels.game }}:
              {{ range $i, $s := query (printf "max by (player) (game_player_online{game='%s'})" $labels.game) }}{{ if $i }}, {{ end }}{{ $s.Labels.player }}{{ end }}
        # Eventos: só o exporter do Zomboid publica mortes e marcos hoje, mas valem para qualquer jogo que publicar
        - alert: PlayerDied
          expr: time() - max by (game, player) (game_player_last_death_timestamp_seconds) < 180
          labels:
            severity: info
            notify: events
          annotations:
            summary: "💀 {{ $labels.player }} morreu"
            description: >-
              {{ with query (printf "max(game_player_last_death_hours_survived{game=%q,player=%q})" $labels.game $labels.player) }}O personagem sobreviveu {{ . | first | value | printf "%.0f" }} horas no jogo.{{ else }}Mais um para a horda.{{ end }}
        - alert: PlayerMilestone
          expr: max by (game, player) (game_player_milestone_hours) > max by (game, player) (game_player_milestone_hours offset 10m)
          labels:
            severity: info
            notify: events
          annotations:
            summary: "🏆 {{ $labels.player }} completou {{ $value | printf \"%.0f\" }} horas no servidor"
            description: "Tempo total jogado em {{ $labels.game }}."
