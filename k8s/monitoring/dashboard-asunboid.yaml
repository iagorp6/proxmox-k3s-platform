apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-asunboid
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  asunboid.json: |
    {
      "title": "AsunBoid - Servidor de Jogo",
      "uid": "asunboid",
      "timezone": "America/Sao_Paulo",
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "schemaVersion": 39,
      "templating": {"list": [{"name": "datasource", "type": "datasource", "query": "prometheus", "current": {}, "hide": 0}]},
      "panels": [
        {"type": "stat", "title": "Servidor", "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4},
         "datasource": {"type": "prometheus", "uid": "${datasource}"},
         "targets": [{"expr": "max(zomboid_up)", "refId": "A"}],
         "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "OFFLINE", "color": "red"}, "1": {"text": "ONLINE", "color": "green"}}}], "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}},
         "options": {"colorMode": "background", "graphMode": "none"}},
        {"type": "stat", "title": "Players online", "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4},
         "datasource": {"type": "prometheus", "uid": "${datasource}"},
         "targets": [{"expr": "max(zomboid_players_online)", "refId": "A"}],
         "fieldConfig": {"defaults": {"max": 6, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}},
         "options": {"colorMode": "value", "graphMode": "area"}},
        {"type": "gauge", "title": "Memória do servidor (% do limit)", "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4},
         "datasource": {"type": "prometheus", "uid": "${datasource}"},
         "targets": [{"expr": "max(container_memory_working_set_bytes{namespace=\"zomboid\",container=\"server\"}) / max(kube_pod_container_resource_limits{namespace=\"zomboid\",container=\"server\",resource=\"memory\"})", "refId": "A"}],
         "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.8}, {"color": "red", "value": 0.9}]}}}},
        {"type": "stat", "title": "Último backup (há)", "gridPos": {"x": 12, "y": 0, "w": 4, "h": 4},
         "datasource": {"type": "prometheus", "uid": "${datasource}"},
         "targets": [{"expr": "time() - max(kube_cronjob_status_last_successful_time{namespace=\"zomboid\",cronjob=\"zomboid-backup\"})", "refId": "A"}],
         "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 90000}, {"color": "red", "value": 93600}]}}},
         "options": {"colorMode": "value", "graphMode": "none"}},
        {"type": "stat", "title": "SMART dos discos", "gridPos": {"x": 16, "y": 0, "w": 4, "h": 4},
         "datasource": {"type": "prometheus", "uid": "${datasource}"},
         "targets": [{"expr": "min(smartctl_device_smart_status)", "refId": "A"}],
         "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "FALHA", "color": "red"}, "1": {"text": "OK", "color": "green"}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}},
         "options": {"colorMode": "background", "graphMode": "none"}},
        {"type": "stat", "title": "Pool ZFS rpool", "gridPos": {"x": 20, "y": 0, "w": 4, "h": 4},
         "datasource": {"type": "prometheus", "uid": "${datasource}"},
         "targets": [{"expr": "max(node_zfs_zpool_state{zpool=\"rpool\",state=\"online\"})", "refId": "A"}],
         "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DEGRADADO", "color": "red"}, "1": {"text": "ONLINE", "color": "green"}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}},
         "options": {"colorMode": "background", "graphMode": "none"}},
        {"type": "timeseries", "title": "Players online", "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "${datasource}"},
         "targets": [{"expr": "max(zomboid_players_online)", "legendFormat": "players", "refId": "A"}],
         "fieldConfig": {"defaults": {"min": 0, "decimals": 0}}},
        {"type": "timeseries", "title": "Memória do servidor do jogo", "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "${datasource}"},
         "targets": [
           {"expr": "max(container_memory_working_set_bytes{namespace=\"zomboid\",container=\"server\"})", "legendFormat": "em uso", "refId": "A"},
           {"expr": "max(kube_pod_container_resource_limits{namespace=\"zomboid\",container=\"server\",resource=\"memory\"})", "legendFormat": "limit", "refId": "B"}],
         "fieldConfig": {"defaults": {"unit": "bytes", "min": 0}}},
        {"type": "timeseries", "title": "CPU do servidor do jogo (cores)", "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "${datasource}"},
         "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"zomboid\",container=\"server\"}[5m]))", "legendFormat": "cpu", "refId": "A"}],
         "fieldConfig": {"defaults": {"min": 0}}},
        {"type": "timeseries", "title": "Temperatura dos discos", "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "${datasource}"},
         "targets": [{"expr": "smartctl_device_temperature{temperature_type=\"current\"}", "legendFormat": "{{device}}", "refId": "A"}],
         "fieldConfig": {"defaults": {"unit": "celsius"}}},
        {"type": "timeseries", "title": "Erros de memória ECC (acumulado)", "gridPos": {"x": 0, "y": 20, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "${datasource}"},
         "targets": [
           {"expr": "sum(node_edac_correctable_errors_total)", "legendFormat": "corrigidos", "refId": "A"},
           {"expr": "sum(node_edac_uncorrectable_errors_total)", "legendFormat": "não corrigidos", "refId": "B"}],
         "fieldConfig": {"defaults": {"min": 0, "decimals": 0}}},
        {"type": "timeseries", "title": "Memória disponível (VM e host)", "gridPos": {"x": 12, "y": 20, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "${datasource}"},
         "targets": [
           {"expr": "node_memory_MemAvailable_bytes{job=\"node-exporter\"}", "legendFormat": "VM k3s-01", "refId": "A"},
           {"expr": "node_memory_MemAvailable_bytes{job=\"proxmox-node\"}", "legendFormat": "host Proxmox", "refId": "B"}],
         "fieldConfig": {"defaults": {"unit": "bytes", "min": 0}}}
      ]
    }
