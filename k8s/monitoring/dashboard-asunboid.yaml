apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-asunboid
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  asunboid.json: |
    {
      "title": "AsunBoid - Plataforma de Jogos",
      "uid": "asunboid",
      "description": "Plataforma de jogos em K3s sobre Proxmox (um jogo ativo por vez). Dashboard como código (GitOps via Argo CD).",
      "tags": [
        "homelab",
        "games",
        "k3s"
      ],
      "timezone": "America/Sao_Paulo",
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "schemaVersion": 39,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Agora",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": [],
          "id": 1
        },
        {
          "type": "stat",
          "title": "Jogo ativo",
          "description": "Jogo no ar agora (troca com make switch-game GAME=<jogo>).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "label_replace(label_replace(label_replace(label_replace(max by (namespace) (kube_statefulset_replicas{namespace=~\"minecraft|terraria|zomboid\"}) > 0, \"game\", \"$1\", \"namespace\", \"(.+)\"), \"jogo\", \"Minecraft\", \"game\", \"minecraft\"), \"jogo\", \"Terraria\", \"game\", \"terraria\"), \"jogo\", \"Project Zomboid\", \"game\", \"zomboid\")",
              "refId": "A",
              "legendFormat": "{{jogo}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "noValue": "nenhum"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "name",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 2
        },
        {
          "type": "stat",
          "title": "Servidor",
          "description": "O jogo ativo responde (RCON no Zomboid, API REST no Terraria)? Alerta no Discord se cair.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "max((max by (game) (game_up)) * on (game) (label_replace(max by (namespace) (kube_statefulset_replicas{namespace=~\"minecraft|terraria|zomboid\"}) > 0, \"game\", \"$1\", \"namespace\", \"(.+)\"))) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "OFFLINE",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "ONLINE",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 3
        },
        {
          "type": "stat",
          "title": "Players online",
          "description": "Jogadores conectados no jogo ativo, de no máximo 6 vagas.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "sum((max by (game) (game_players_online)) * on (game) (label_replace(max by (namespace) (kube_statefulset_replicas{namespace=~\"minecraft|terraria|zomboid\"}) > 0, \"game\", \"$1\", \"namespace\", \"(.+)\"))) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "unit": "suffix: / 6",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 4
        },
        {
          "type": "stat",
          "title": "Disponibilidade (7 dias)",
          "description": "% do tempo em que o jogo ativo respondeu nos últimos 7 dias. Trocas de jogo e o restart diário contam como indisponibilidade. O SLO oficial (28 dias, com error budget) fica na seção SLO.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "avg_over_time((max((max by (game) (game_up)) * on (game) (label_replace(max by (namespace) (kube_statefulset_replicas{namespace=~\"minecraft|terraria|zomboid\"}) > 0, \"game\", \"$1\", \"namespace\", \"(.+)\"))) or vector(0))[7d:5m])",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.95
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              },
              "unit": "percentunit",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 5
        },
        {
          "type": "stat",
          "title": "Backup mais antigo",
          "description": "Tempo desde o último backup bem-sucedido do jogo mais atrasado (restic → AWS S3, diário). Vermelho acima de 26h.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "time() - min(kube_cronjob_status_last_successful_time{cronjob=~\".+-backup\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 90000
                  },
                  {
                    "color": "red",
                    "value": 93600
                  }
                ]
              },
              "unit": "dtdurations"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 6
        },
        {
          "type": "stat",
          "title": "Alertas ativos",
          "description": "Problemas disparados agora (os mesmos enviados ao Discord). Entradas de jogadores não contam.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "count(ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor|.*PlayerOnline\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Nenhum",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ],
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 7
        },
        {
          "type": "state-timeline",
          "title": "Jogo ativo e disponibilidade",
          "description": "Linha de cima: qual jogo estava no ar. Linha de baixo: verde = respondendo, vermelho = fora (inclui o tempo de cada troca).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 5
          },
          "targets": [
            {
              "expr": "max by (game) (label_replace(max by (namespace) (kube_statefulset_replicas{namespace=~\"minecraft|terraria|zomboid\"}) > 0, \"game\", \"$1\", \"namespace\", \"(.+)\"))",
              "refId": "A",
              "legendFormat": "{{game}}"
            },
            {
              "expr": "max((max by (game) (game_up)) * on (game) (label_replace(max by (namespace) (kube_statefulset_replicas{namespace=~\"minecraft|terraria|zomboid\"}) > 0, \"game\", \"$1\", \"namespace\", \"(.+)\"))) or vector(0)",
              "refId": "B",
              "legendFormat": "Servidor no ar"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "custom": {
                "fillOpacity": 85,
                "lineWidth": 0,
                "insertNulls": 90000
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Servidor no ar"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "OFFLINE",
                            "color": "red",
                            "index": 0
                          },
                          "1": {
                            "text": "ONLINE",
                            "color": "green",
                            "index": 1
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^(zomboid|terraria|minecraft)$"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": {
                            "text": "ativo",
                            "color": "blue",
                            "index": 0
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showValue": "never",
            "mergeValues": true,
            "rowHeight": 0.8,
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "id": 8
        },
        {
          "type": "row",
          "title": "SLO: 99% do tempo no ar em 28 dias",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 24,
            "h": 1
          },
          "panels": [],
          "id": 9
        },
        {
          "type": "stat",
          "title": "Disponibilidade (28 dias)",
          "description": "SLI do SLO: fração do tempo em que o jogo ativo respondeu ao exporter. Trocas, restart diário e reboot de patch contam como fora. Meta: 99%.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 6,
            "h": 6
          },
          "targets": [
            {
              "expr": "1 - game_slo:unavailable:ratio_avg28d",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.99
                  },
                  {
                    "color": "green",
                    "value": 0.995
                  }
                ]
              },
              "unit": "percentunit",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 10
        },
        {
          "type": "stat",
          "title": "Error budget restante",
          "description": "Quanto sobra dos 1% de indisponibilidade permitidos em 28 dias (6h43min). Abaixo de 0, a política de docs/slo.md congela mudanças de risco no jogo.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 6,
            "y": 11,
            "w": 6,
            "h": 6
          },
          "targets": [
            {
              "expr": "1 - game_slo:unavailable:ratio_avg28d / 0.01",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 0.25
                  }
                ]
              },
              "unit": "percentunit",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 11
        },
        {
          "type": "timeseries",
          "title": "Burn rate do error budget",
          "description": "Velocidade de consumo do budget: 1 = acaba em exatos 28 dias. GameSLOBurnRateHigh: acima de 6 em 6h e 30min. GameSLOBurnRateSlow: acima de 1 em 3 dias e 6h.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 11,
            "w": 12,
            "h": 6
          },
          "targets": [
            {
              "expr": "game_slo:burn_rate:avg30m",
              "refId": "A",
              "legendFormat": "30 min"
            },
            {
              "expr": "game_slo:burn_rate:avg6h",
              "refId": "B",
              "legendFormat": "6 h"
            },
            {
              "expr": "game_slo:burn_rate:avg3d",
              "refId": "C",
              "legendFormat": "3 dias"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 6
                  }
                ]
              },
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 12
        },
        {
          "type": "row",
          "title": "Jogadores",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 24,
            "h": 1
          },
          "panels": [],
          "id": 13
        },
        {
          "type": "table",
          "title": "Online agora",
          "description": "Quem está conectado neste momento e quanto jogou nas últimas 24h.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "expr": "(sum by (game, player) (count_over_time(game_player_online[24h])) * 30) and on (game, player) (max by (game, player) (game_player_online))",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dtdurations",
              "noValue": "Ninguém online agora"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Jogo"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "string"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "minecraft": {
                            "text": "Minecraft",
                            "color": "text",
                            "index": 0
                          },
                          "terraria": {
                            "text": "Terraria",
                            "color": "text",
                            "index": 1
                          },
                          "zomboid": {
                            "text": "Project Zomboid",
                            "color": "text",
                            "index": 2
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Jogador"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "string"
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "game": 0,
                  "player": 1,
                  "Value": 2
                },
                "renameByName": {
                  "game": "Jogo",
                  "player": "Jogador",
                  "Value": "Jogou nas últimas 24h"
                }
              }
            }
          ],
          "options": {
            "showHeader": true
          },
          "id": 14
        },
        {
          "type": "timeseries",
          "title": "Players online ao longo do tempo",
          "description": "Jogadores conectados em cada jogo. Linha tracejada = limite de 6 vagas.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 18,
            "w": 16,
            "h": 8
          },
          "targets": [
            {
              "expr": "max by (game) (game_players_online)",
              "refId": "A",
              "legendFormat": "{{game}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 6,
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 6
                  }
                ]
              },
              "custom": {
                "lineInterpolation": "stepAfter",
                "fillOpacity": 25,
                "lineWidth": 2,
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 15
        },
        {
          "type": "state-timeline",
          "title": "Linha do tempo de sessões",
          "description": "Cada faixa é um jogador em um jogo; o trecho colorido é o período em que ele esteve online.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 24,
            "h": 7
          },
          "targets": [
            {
              "expr": "max by (game, player) (game_player_online)",
              "refId": "A",
              "legendFormat": "{{player}} ({{game}})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "online",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "custom": {
                "fillOpacity": 80,
                "lineWidth": 0,
                "insertNulls": 90000
              }
            },
            "overrides": []
          },
          "options": {
            "showValue": "never",
            "mergeValues": true,
            "rowHeight": 0.7,
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "id": 16
        },
        {
          "type": "table",
          "title": "Tempo online por jogador",
          "description": "Por jogo: tempo jogado em cada período, total desde o início, mortes (Zomboid) e último acesso. A barra dos 30 dias funciona como ranking.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 33,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
