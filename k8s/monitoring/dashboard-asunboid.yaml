apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-asunboid
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  asunboid.json: |
    {
      "title": "AsunBoid - Servidor de Jogo",
      "uid": "asunboid",
      "description": "Project Zomboid B42 em K3s sobre Proxmox. Dashboard como código (GitOps via Argo CD).",
      "tags": [
        "homelab",
        "zomboid",
        "k3s"
      ],
      "timezone": "America/Sao_Paulo",
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "schemaVersion": 39,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Agora",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": [],
          "id": 1
        },
        {
          "type": "stat",
          "title": "Servidor",
          "description": "O servidor responde ao RCON? Se OFFLINE por mais de 3 min, o alerta ZomboidDown dispara no Discord.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "max(zomboid_up) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "OFFLINE",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "ONLINE",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 2
        },
        {
          "type": "stat",
          "title": "Players online",
          "description": "Jogadores conectados agora, de no máximo 6 vagas.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "max(zomboid_players_online)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "unit": "suffix: / 6",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 3
        },
        {
          "type": "stat",
          "title": "Disponibilidade (7 dias)",
          "description": "SLO: % do tempo em que o servidor respondeu nos últimos 7 dias. Meta: 99%. O restart diário das 6h consome cerca de 0,3%.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "avg_over_time((max(zomboid_up) or vector(0))[7d:5m])",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.95
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              },
              "unit": "percentunit",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 4
        },
        {
          "type": "stat",
          "title": "No ar há",
          "description": "Tempo desde que o processo do servidor iniciou (restart diário, deploy ou crash).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "time() - max(kube_pod_container_state_started{namespace=\"zomboid\",container=\"server\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "dtdurations"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 5
        },
        {
          "type": "stat",
          "title": "Último backup",
          "description": "Tempo desde o último backup bem-sucedido do mundo (restic → AWS S3, diário às 5h30). Vermelho acima de 26h.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "time() - max(kube_cronjob_status_last_successful_time{namespace=\"zomboid\",cronjob=\"zomboid-backup\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 90000
                  },
                  {
                    "color": "red",
                    "value": 93600
                  }
                ]
              },
              "unit": "dtdurations"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 6
        },
        {
          "type": "stat",
          "title": "Alertas ativos",
          "description": "Problemas disparados agora (os mesmos enviados ao Discord). Entradas de jogadores não contam.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "count(ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor|PlayerOnline\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Nenhum",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ],
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 7
        },
        {
          "type": "state-timeline",
          "title": "Servidor no ar (período selecionado)",
          "description": "Faixa verde = servidor respondendo; vermelha = fora do ar. Mostra quando e por quanto tempo houve quedas.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 3
          },
          "targets": [
            {
              "expr": "max(zomboid_up) or vector(0)",
              "refId": "A",
              "legendFormat": "Servidor"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "OFFLINE",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "ONLINE",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "custom": {
                "fillOpacity": 85,
                "lineWidth": 0
              }
            },
            "overrides": []
          },
          "options": {
            "showValue": "never",
            "mergeValues": true,
            "rowHeight": 0.8,
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "id": 8
        },
        {
          "type": "row",
          "title": "Jogadores",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 24,
            "h": 1
          },
          "panels": [],
          "id": 9
        },
        {
          "type": "table",
          "title": "Online agora",
          "description": "Quem está conectado neste momento e quanto jogou nas últimas 24h.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "expr": "(sum by (player) (count_over_time(zomboid_player_online[24h])) * 30) and on (player) max by (player) (zomboid_player_online)",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dtdurations",
              "noValue": "Ninguém online agora"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Jogador"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "string"
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "player": "Jogador",
                  "Value": "Jogou nas últimas 24h"
                }
              }
            }
          ],
          "options": {
            "showHeader": true
          },
          "id": 10
        },
        {
          "type": "timeseries",
          "title": "Players online ao longo do tempo",
          "description": "Quantos jogadores estavam conectados em cada momento. Linha tracejada = limite de 6 vagas.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 9,
            "w": 16,
            "h": 8
          },
          "targets": [
            {
              "expr": "max(zomboid_players_online)",
              "refId": "A",
              "legendFormat": "players"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 6,
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 6
                  }
                ]
              },
              "custom": {
                "lineInterpolation": "stepAfter",
                "fillOpacity": 25,
                "lineWidth": 2,
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "id": 11
        },
        {
          "type": "state-timeline",
          "title": "Linha do tempo de sessões",
          "description": "Cada faixa é um jogador; o trecho colorido é o período em que ele esteve online.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 24,
            "h": 7
          },
          "targets": [
            {
              "expr": "max by (player) (zomboid_player_online)",
              "refId": "A",
              "legendFormat": "{{player}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "online",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "custom": {
                "fillOpacity": 80,
                "lineWidth": 0,
                "insertNulls": 90000
              }
            },
            "overrides": []
          },
          "options": {
            "showValue": "never",
            "mergeValues": true,
            "rowHeight": 0.7,
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "id": 12
        },
        {
          "type": "table",
          "title": "Tempo online por jogador",
          "description": "Tempo jogado em cada período e o último acesso. A barra da coluna de 30 dias funciona como ranking.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "expr": "max by (player) (last_over_time(timestamp(zomboid_player_online)[30d:1m])) * 1000",
              "refId": "A",
              "instant": true,
              "format": "table"
            },
            {
              "expr": "sum by (player) (count_over_time(zomboid_player_online[24h])) * 30",
              "refId": "B",
              "instant": true,
              "format": "table"
            },
            {
              "expr": "sum by (player) (count_over_time(zomboid_player_online[7d])) * 30",
              "refId": "C",
              "instant": true,
              "format": "table"
            },
            {
              "expr": "sum by (player) (count_over_time(zomboid_player_online[30d])) * 30",
              "refId": "D",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dtdurations",
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Jogador"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "string"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Último acesso"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeFromNow"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Últimos 30 dias"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "gradient",
                      "valueDisplayMode": "text"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "continuous-BlPu"
                    }
                  },
                  {
                    "id": "min",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "player": 0,
                  "Value #A": 1,
                  "Value #B": 2,
                  "Value #C": 3,
                  "Value #D": 4
                },
                "renameByName": {
                  "player": "Jogador",
                  "Value #A": "Último acesso",
                  "Value #B": "Últimas 24h",
                  "Value #C": "Últimos 7 dias",
                  "Value #D": "Últimos 30 dias"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Últimos 30 dias",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Últimos 30 dias",
                "desc": true
              }
            ]
          },
          "id": 13
        },
        {
          "type": "row",
          "title": "Servidor do jogo (recursos)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 24,
            "h": 1
          },
          "panels": [],
          "id": 14
        },
        {
          "type": "timeseries",
          "title": "Memória do servidor",
          "description": "Memória usada pelo jogo contra o limite do container (linha vermelha). Se encostar no limite, o Kubernetes mata o processo (OOMKilled). Alerta acima de 90%.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 33,
            "w": 10,
            "h": 8
          },
          "targets": [
            {
              "expr": "max(container_memory_working_set_bytes{namespace=\"zomboid\",container=\"server\"})",
              "refId": "A",
              "legendFormat": "em uso"
            },
            {
              "expr": "max(kube_pod_container_resource_limits{namespace=\"zomboid\",container=\"server\",resource=\"memory\"})",
              "refId": "B",
              "legendFormat": "limite"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "fillOpacity": 20,
                "lineWidth": 2
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "limite"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 15
        },
        {
          "type": "timeseries",
          "title": "CPU do servidor",
          "description": "Núcleos de CPU usados pelo jogo. A VM tem 4 vCPUs (linha tracejada). Picos durante a carga do mundo são normais.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 10,
            "y": 33,
            "w": 10,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"zomboid\",container=\"server\"}[5m]))",
              "refId": "A",
              "legendFormat": "cores"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "softMax": 4,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 4
                  }
                ]
              },
              "custom": {
                "fillOpacity": 20,
                "lineWidth": 2,
                "axisLabel": "cores",
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "id": 16
        },
        {
          "type": "stat",
          "title": "Crashes (7 dias)",
          "description": "Reinícios inesperados do processo do jogo (crash ou OOMKilled). Restarts planejados não contam.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 20,
            "y": 33,
            "w": 4,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"zomboid\",container=\"server\"}[7d])) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Nenhum",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ],
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
