apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-asunboid
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  asunboid.json: |
    {
      "title": "AsunBoid - Servidor de Jogo",
      "uid": "asunboid",
      "description": "Proxmox + K3s + Project Zomboid B42. Provisionado como código (Terraform, Ansible, Helm).",
      "timezone": "America/Sao_Paulo",
      "refresh": "30s",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "schemaVersion": 39,
      "tags": [
        "homelab",
        "zomboid",
        "k3s"
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Visão geral",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Servidor",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "max(zomboid_up)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "OFFLINE",
                      "color": "red"
                    },
                    "1": {
                      "text": "ONLINE",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "type": "stat",
          "title": "Players online",
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "max(zomboid_players_online)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "type": "stat",
          "title": "Pico de players (24h)",
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "max_over_time((max(zomboid_players_online))[24h:1m])",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "purple",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "type": "stat",
          "title": "Disponibilidade (7 dias)",
          "description": "SLO: % do tempo em que o servidor respondeu ao RCON",
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "avg_over_time((max(zomboid_up))[7d:5m])",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.95
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "type": "stat",
          "title": "Uptime desde o último restart",
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "time() - max(kube_pod_start_time{namespace=\"zomboid\",pod=\"zomboid-0\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "type": "stat",
          "title": "Último backup (há)",
          "description": "Backup diário criptografado no AWS S3 (restic)",
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "time() - max(kube_cronjob_status_last_successful_time{namespace=\"zomboid\",cronjob=\"zomboid-backup\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 90000
                  },
                  {
                    "color": "red",
                    "value": 93600
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "type": "gauge",
          "title": "Memória do servidor",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "max(container_memory_working_set_bytes{namespace=\"zomboid\",container=\"server\"}) / max(kube_pod_container_resource_limits{namespace=\"zomboid\",container=\"server\",resource=\"memory\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "CPU do servidor (cores)",
          "gridPos": {
            "x": 4,
            "y": 5,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"zomboid\",container=\"server\"}[5m]))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "red",
                    "value": 2.7
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "type": "stat",
          "title": "SMART dos discos",
          "gridPos": {
            "x": 8,
            "y": 5,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "min(smartctl_device_smart_status)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "FALHA",
                      "color": "red"
                    },
                    "1": {
                      "text": "OK",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "type": "stat",
          "title": "Pool ZFS",
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "max(node_zfs_zpool_state{zpool=\"rpool\",state=\"online\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DEGRADADO",
                      "color": "red"
                    },
                    "1": {
                      "text": "ONLINE",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "type": "stat",
          "title": "Erros de memória (ECC)",
          "description": "Corrigidos / não corrigidos desde o boot do host",
          "gridPos": {
            "x": 16,
            "y": 5,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(node_edac_correctable_errors_total) or vector(0)",
              "legendFormat": "corrigidos",
              "refId": "A"
            },
            {
              "expr": "sum(node_edac_uncorrectable_errors_total) or vector(0)",
              "legendFormat": "não corrigidos",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        },
        {
          "type": "stat",
          "title": "Alertas ativos",
          "gridPos": {
            "x": 20,
            "y": 5,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "count(ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "type": "row",
          "title": "Jogadores",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Players online",
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 16,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "max(zomboid_players_online)",
              "legendFormat": "players",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter",
                "fillOpacity": 25
              }
            }
          }
        },
        {
          "type": "table",
          "title": "Quem está online agora",
          "gridPos": {
            "x": 16,
            "y": 10,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "max by (player) (zomboid_player_online)",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true
                },
                "renameByName": {
                  "player": "Jogador"
                }
              }
            }
          ]
        },
        {
          "type": "row",
          "title": "Recursos",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Memória do servidor do jogo",
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "max(container_memory_working_set_bytes{namespace=\"zomboid\",container=\"server\"})",
              "legendFormat": "em uso",
              "refId": "A"
            },
            {
              "expr": "max(kube_pod_container_resource_limits{namespace=\"zomboid\",container=\"server\",resource=\"memory\"})",
              "legendFormat": "limit",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0
            }
          }
        },
        {
          "type": "timeseries",
          "title": "CPU do servidor do jogo (cores)",
          "gridPos": {
            "x": 8,
            "y": 19,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"zomboid\",container=\"server\"}[5m]))",
              "legendFormat": "cpu",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Tráfego de rede do servidor",
          "gridPos": {
            "x": 16,
            "y": 19,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"zomboid\",pod=\"zomboid-0\"}[5m])) * 8",
              "legendFormat": "entrada",
              "refId": "A"
            },
            {
              "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"zomboid\",pod=\"zomboid-0\"}[5m])) * 8",
              "legendFormat": "saída",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "min": 0
            }
          }
        },
        {
          "type": "row",
          "title": "Saúde do hardware (HPE DL20 Gen9)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 27,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Memória disponível (VM e host)",
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "node_memory_MemAvailable_bytes{job=\"node-exporter\"}",
              "legendFormat": "VM k3s-01",
              "refId": "A"
            },
            {
              "expr": "node_memory_MemAvailable_bytes{job=\"proxmox-node\"}",
              "legendFormat": "host Proxmox",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Temperatura dos discos",
          "gridPos": {
            "x": 12,
            "y": 28,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "smartctl_device_temperature{temperature_type=\"current\"}",
              "legendFormat": "{{device}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 50
                  }
                ]
              },
              "custom": {
                "thresholdsStyle": {
                  "mode": "line"
                }
              }
            }
          }
        },
        {
          "type": "row",
          "title": "Logs do servidor (Loki)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 36,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Volume de logs por nível",
          "gridPos": {
            "x": 0,
            "y": 37,
            "w": 24,
            "h": 6
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "expr": "sum by (level) (count_over_time({namespace=\"zomboid\", container=\"server\"} [5m]))",
              "legendFormat": "{{level}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 70,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "ERROR"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "WARN"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "LOG"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "logs",
          "title": "Conexões de jogadores",
          "gridPos": {
            "x": 0,
            "y": 43,
            "w": 12,
            "h": 10
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "expr": "{namespace=\"zomboid\", container=\"server\"} |~ \"(?i)(connected|disconnect|login|logged)\"",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        },
        {
          "type": "logs",
          "title": "Erros e avisos",
          "gridPos": {
            "x": 12,
            "y": 43,
            "w": 12,
            "h": 10
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "expr": "{namespace=\"zomboid\", container=\"server\", level=~\"ERROR|WARN\"}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        },
        {
          "type": "row",
          "title": "Alertas",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 53,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "table",
          "title": "Alertas disparados agora (enviados ao Discord)",
          "gridPos": {
            "x": 0,
            "y": 54,
            "w": 24,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
