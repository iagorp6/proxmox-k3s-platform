          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "softMax": 4,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 4
                  }
