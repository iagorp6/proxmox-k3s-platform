apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-asunboid
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  asunboid.json: |
    {
      "title": "AsunBoid - Plataforma de Jogos",
      "uid": "asunboid",
      "description": "Plataforma de jogos em K3s sobre Proxmox (um jogo ativo por vez). Dashboard como código (GitOps via Argo CD).",
      "tags": [
        "homelab",
        "games",
        "k3s"
      ],
      "timezone": "America/Sao_Paulo",
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "schemaVersion": 39,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Agora",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": [],
          "id": 1
        },
        {
          "type": "stat",
          "title": "Jogo ativo",
          "description": "Jogo no ar agora (troca com make switch-game GAME=<jogo>).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "label_replace(label_replace(label_replace(max by (namespace) (kube_statefulset_replicas{namespace=~\"zomboid|terraria\"}) > 0, \"game\", \"$1\", \"namespace\", \"(.+)\"), \"jogo\", \"Project Zomboid\", \"game\", \"zomboid\"), \"jogo\", \"Terraria\", \"game\", \"terraria\")",
              "refId": "A",
              "legendFormat": "{{jogo}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "noValue": "nenhum"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "name",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 2
        },
        {
          "type": "stat",
          "title": "Servidor",
          "description": "O jogo ativo responde (RCON no Zomboid, API REST no Terraria)? Alerta no Discord se cair.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "max((label_replace(max(zomboid_up), \"game\", \"zomboid\", \"\", \"\") or max by (game) (game_up)) * on (game) (label_replace(max by (namespace) (kube_statefulset_replicas{namespace=~\"zomboid|terraria\"}) > 0, \"game\", \"$1\", \"namespace\", \"(.+)\"))) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "OFFLINE",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "ONLINE",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 3
        },
        {
          "type": "stat",
          "title": "Players online",
          "description": "Jogadores conectados no jogo ativo, de no máximo 6 vagas.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "sum((label_replace(max(zomboid_players_online), \"game\", \"zomboid\", \"\", \"\") or max by (game) (game_players_online)) * on (game) (label_replace(max by (namespace) (kube_statefulset_replicas{namespace=~\"zomboid|terraria\"}) > 0, \"game\", \"$1\", \"namespace\", \"(.+)\"))) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "unit": "suffix: / 6",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 4
        },
        {
          "type": "stat",
          "title": "Disponibilidade (7 dias)",
          "description": "SLO: % do tempo em que o jogo ativo respondeu nos últimos 7 dias. Trocas de jogo e o restart diário contam como indisponibilidade. Meta: 99%.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "avg_over_time((max((label_replace(max(zomboid_up), \"game\", \"zomboid\", \"\", \"\") or max by (game) (game_up)) * on (game) (label_replace(max by (namespace) (kube_statefulset_replicas{namespace=~\"zomboid|terraria\"}) > 0, \"game\", \"$1\", \"namespace\", \"(.+)\"))) or vector(0))[7d:5m])",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.95
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              },
              "unit": "percentunit",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 5
        },
        {
          "type": "stat",
          "title": "Backup mais antigo",
          "description": "Tempo desde o último backup bem-sucedido do jogo mais atrasado (restic → AWS S3, diário). Vermelho acima de 26h.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "time() - min(kube_cronjob_status_last_successful_time{cronjob=~\".+-backup\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 90000
                  },
                  {
                    "color": "red",
                    "value": 93600
                  }
                ]
              },
              "unit": "dtdurations"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 6
        },
        {
          "type": "stat",
          "title": "Alertas ativos",
          "description": "Problemas disparados agora (os mesmos enviados ao Discord). Entradas de jogadores não contam.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "expr": "count(ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor|.*PlayerOnline\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Nenhum",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ],
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "id": 7
        },
        {
          "type": "state-timeline",
          "title": "Jogo ativo e disponibilidade",
          "description": "Linha de cima: qual jogo estava no ar. Linha de baixo: verde = respondendo, vermelho = fora (inclui o tempo de cada troca).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 5
          },
          "targets": [
            {
              "expr": "max by (game) (label_replace(max by (namespace) (kube_statefulset_replicas{namespace=~\"zomboid|terraria\"}) > 0, \"game\", \"$1\", \"namespace\", \"(.+)\"))",
              "refId": "A",
              "legendFormat": "{{game}}"
            },
            {
              "expr": "max((label_replace(max(zomboid_up), \"game\", \"zomboid\", \"\", \"\") or max by (game) (game_up)) * on (game) (label_replace(max by (namespace) (kube_statefulset_replicas{namespace=~\"zomboid|terraria\"}) > 0, \"game\", \"$1\", \"namespace\", \"(.+)\"))) or vector(0)",
              "refId": "B",
              "legendFormat": "Servidor no ar"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "custom": {
                "fillOpacity": 85,
                "lineWidth": 0,
                "insertNulls": 90000
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Servidor no ar"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "OFFLINE",
                            "color": "red",
                            "index": 0
                          },
                          "1": {
                            "text": "ONLINE",
                            "color": "green",
                            "index": 1
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^(zomboid|terraria)$"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": {
                            "text": "ativo",
                            "color": "blue",
                            "index": 0
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showValue": "never",
            "mergeValues": true,
            "rowHeight": 0.8,
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "id": 8
        },
        {
          "type": "row",
          "title": "Jogadores",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 24,
            "h": 1
          },
          "panels": [],
          "id": 9
        },
        {
          "type": "table",
          "title": "Online agora",
          "description": "Quem está conectado neste momento e quanto jogou nas últimas 24h.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "expr": "(label_replace(sum by (player) (count_over_time(zomboid_player_online[24h])) * 30, \"game\", \"zomboid\", \"\", \"\") or sum by (game, player) (count_over_time(game_player_online[24h])) * 30) and on (game, player) (label_replace(max by (player) (zomboid_player_online), \"game\", \"zomboid\", \"\", \"\") or max by (game, player) (game_player_online))",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dtdurations",
              "noValue": "Ninguém online agora"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Jogo"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "string"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "zomboid": {
                            "text": "Project Zomboid",
                            "color": "text",
                            "index": 0
                          },
                          "terraria": {
                            "text": "Terraria",
                            "color": "text",
                            "index": 1
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Jogador"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "string"
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "game": 0,
                  "player": 1,
                  "Value": 2
                },
                "renameByName": {
                  "game": "Jogo",
                  "player": "Jogador",
                  "Value": "Jogou nas últimas 24h"
                }
              }
            }
          ],
          "options": {
            "showHeader": true
          },
          "id": 10
        },
        {
          "type": "timeseries",
          "title": "Players online ao longo do tempo",
          "description": "Jogadores conectados em cada jogo. Linha tracejada = limite de 6 vagas.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 11,
            "w": 16,
            "h": 8
          },
          "targets": [
            {
              "expr": "label_replace(max(zomboid_players_online), \"game\", \"zomboid\", \"\", \"\") or max by (game) (game_players_online)",
              "refId": "A",
              "legendFormat": "{{game}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 6,
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 6
                  }
                ]
              },
              "custom": {
                "lineInterpolation": "stepAfter",
                "fillOpacity": 25,
                "lineWidth": 2,
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 11
        },
        {
          "type": "state-timeline",
          "title": "Linha do tempo de sessões",
          "description": "Cada faixa é um jogador em um jogo; o trecho colorido é o período em que ele esteve online.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 24,
            "h": 7
          },
          "targets": [
            {
              "expr": "label_replace(max by (player) (zomboid_player_online), \"game\", \"zomboid\", \"\", \"\") or max by (game, player) (game_player_online)",
              "refId": "A",
              "legendFormat": "{{player}} ({{game}})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "online",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "custom": {
                "fillOpacity": 80,
                "lineWidth": 0,
                "insertNulls": 90000
              }
            },
            "overrides": []
          },
          "options": {
            "showValue": "never",
            "mergeValues": true,
            "rowHeight": 0.7,
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "id": 12
        },
        {
          "type": "table",
          "title": "Tempo online por jogador",
          "description": "Por jogo: tempo jogado em cada período, total desde o início, mortes (Zomboid) e último acesso. A barra dos 30 dias funciona como ranking.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "expr": "label_replace(max by (player) (last_over_time(timestamp(zomboid_player_online)[30d:1m])) * 1000, \"game\", \"zomboid\", \"\", \"\") or max by (game, player) (last_over_time(timestamp(game_player_online)[30d:1m])) * 1000",
              "refId": "A",
              "instant": true,
              "format": "table"
            },
            {
              "expr": "label_replace(sum by (player) (count_over_time(zomboid_player_online[24h])) * 30, \"game\", \"zomboid\", \"\", \"\") or sum by (game, player) (count_over_time(game_player_online[24h])) * 30",
              "refId": "B",
              "instant": true,
              "format": "table"
            },
            {
              "expr": "label_replace(sum by (player) (count_over_time(zomboid_player_online[7d])) * 30, \"game\", \"zomboid\", \"\", \"\") or sum by (game, player) (count_over_time(game_player_online[7d])) * 30",
              "refId": "C",
              "instant": true,
              "format": "table"
            },
            {
              "expr": "label_replace(sum by (player) (count_over_time(zomboid_player_online[30d])) * 30, \"game\", \"zomboid\", \"\", \"\") or sum by (game, player) (count_over_time(game_player_online[30d])) * 30",
              "refId": "D",
              "instant": true,
              "format": "table"
            },
            {
              "expr": "label_replace(max by (player) (zomboid_player_playtime_seconds_total), \"game\", \"zomboid\", \"\", \"\") or max by (game, player) (game_player_playtime_seconds_total)",
              "refId": "E",
              "instant": true,
              "format": "table"
            },
            {
              "expr": "label_replace(round(sum by (player) (increase(zomboid_player_deaths_total[30d]))), \"game\", \"zomboid\", \"\", \"\")",
              "refId": "F",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dtdurations",
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Jogo"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "string"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "zomboid": {
                            "text": "Project Zomboid",
                            "color": "text",
                            "index": 0
                          },
                          "terraria": {
                            "text": "Terraria",
                            "color": "text",
                            "index": 1
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Jogador"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "string"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Último acesso"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeFromNow"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Mortes (30 dias)"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Últimos 30 dias"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "gradient",
                      "valueDisplayMode": "text"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "continuous-BlPu"
                    }
                  },
                  {
                    "id": "min",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "game": 0,
                  "player": 1,
                  "Value #A": 2,
