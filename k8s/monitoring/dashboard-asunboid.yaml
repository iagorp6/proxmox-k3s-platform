        {
          "type": "timeseries",
          "title": "Memória do servidor",
          "description": "Memória usada pelo jogo ativo contra o limite do container (linha vermelha). Encostar no limite = OOMKilled.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 36,
            "w": 10,
            "h": 8
          },
          "targets": [
            {
              "expr": "max by (namespace) (container_memory_working_set_bytes{namespace=~\"zomboid|terraria\",container=\"server\"})",
              "refId": "A",
              "legendFormat": "{{namespace}} em uso"
            },
            {
              "expr": "max by (namespace) (kube_pod_container_resource_limits{namespace=~\"zomboid|terraria\",container=\"server\",resource=\"memory\"})",
              "refId": "B",
              "legendFormat": "{{namespace}} limite"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "fillOpacity": 20,
                "lineWidth": 2
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*limite$"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "id": 15
        },
        {
          "type": "timeseries",
          "title": "CPU do servidor",
          "description": "Núcleos usados pelo jogo ativo. A VM tem 4 vCPUs (linha tracejada).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 10,
            "y": 36,
            "w": 10,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=~\"zomboid|terraria\",container=\"server\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{namespace}}"
