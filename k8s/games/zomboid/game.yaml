# Catálogo da plataforma: o render-games.py gera Service, métricas, backup e o App do Argo CD.
# O StatefulSet, o ConfigMap de config, o restart diário e os Secrets próprios continuam escritos à mão.
name: zomboid
displayName: Project Zomboid
icon: 🧟            # botão do painel no Discord e resumo semanal
status: active
memory: 10Gi
monitoring: rcon
namespace: zomboid
runAsUser: 1000
# Pod Security baseline (os outros jogos são restricted): o init install roda como root para o chown do
# volume. O namespace também recebe warn/audit=restricted, para aparecer o que falta.
podSecurity: baseline
ports:
  - { name: game, port: 16261, protocol: UDP }
  - { name: direct, port: 16262, protocol: UDP }
service:
  externalTrafficPolicy: Local   # preserva o IP do jogador (logs e ban por IP no servidor)
backup:
  schedule: "30 5 * * *"
  pvc: data-zomboid-0
  paths: [/data/data/Saves, /data/data/db, /data/data/Server]   # PVC montado em /data no job de backup
  # restore drill: save do servidor "k3s" (PZ_SERVER_NAME), banco de jogadores e config
  verify: [data/data/Saves/Multiplayer/k3s/*, data/data/db/k3s.db, data/data/Server/k3s.ini]
# make wipe-game: arquiva no restic (tag archive) e apaga o mundo e os personagens. Server/ fica: o mundo
# novo nasce com o mesmo k3s.ini e o mesmo SandboxVars (mods novos acrescentam as chaves deles no 1º start)
wipe: [/data/data/Saves/Multiplayer/k3s, /data/data/db/k3s.db]
metrics: true
alerts:
  muteDuring: restart-diario   # restart diário das 6h (daily-restart.yaml); janela no Alertmanager
switch:
  # O save do Zomboid é assíncrono: o sleep dá tempo de terminar antes do backup ou da troca de jogo
  saveCommand: echo save > /tmp/console; sleep 30
  suspendWhenIdle: [zomboid-daily-restart]
