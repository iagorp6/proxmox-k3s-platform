apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zomboid
resources:
  - namespace.yaml
  - configmap.yaml
  - externalsecrets.yaml
  - statefulset.yaml
  - daily-restart.yaml
  - platform.generated.yaml   # gerado por scripts/render-games.py

# Código Python versionado como arquivo; o Kustomize gera o ConfigMap
configMapGenerator:
  - name: zomboid-exporter
    files:
      - exporter.py=scripts/exporter.py
generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: replicas.yaml   # gerado por scripts/switch-game.py
