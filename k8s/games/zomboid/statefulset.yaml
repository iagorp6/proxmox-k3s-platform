apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zomboid
  namespace: zomboid
spec:
  serviceName: zomboid
  replicas: 1
  selector:
    matchLabels:
      app: zomboid
  template:
    metadata:
      labels:
        app: zomboid
        app.kubernetes.io/name: zomboid   # usado pelos Services gerados; o selector do StatefulSet é imutável
    spec:
      terminationGracePeriodSeconds: 90
      initContainers:
        - name: install
          image: steamcmd/steamcmd:latest@sha256:0855a0b03960dbf6da43fe4b1f36ec9def900c548688c694d2e6f8ee1a5189d6
          command: ["/bin/bash", "/scripts/install.sh"]
          envFrom:
            - configMapRef:
                name: zomboid-config
          env:
            - name: PZ_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zomboid-secrets
                  key: server-password
            - name: PZ_RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zomboid-secrets
                  key: rcon-password
          volumeMounts:
            - name: data
              mountPath: /pz
            - name: scripts
              mountPath: /scripts
      containers:
        - name: server
          image: steamcmd/steamcmd:latest@sha256:0855a0b03960dbf6da43fe4b1f36ec9def900c548688c694d2e6f8ee1a5189d6
          command: ["/bin/bash", "/scripts/start.sh"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: zomboid-config
          env:
            - name: HOME
              value: /pz/data
            - name: PZ_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zomboid-secrets
                  key: admin-password
          ports:
            - name: game
              containerPort: 16261
              protocol: UDP
            - name: direct
              containerPort: 16262
              protocol: UDP
          resources:
            requests:
              cpu: "3"
              memory: 10Gi
            limits:
              cpu: "3"
              memory: 10Gi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "echo save > /tmp/console; sleep 15; echo quit > /tmp/console; sleep 45"]
          volumeMounts:
            - name: data
              mountPath: /pz
            - name: scripts
              mountPath: /scripts
        - name: exporter
          image: python:3.13-slim@sha256:7c61056e61ac89e852de05f3dc6fa51a6dd2181797bceed46aa725dd7cb2cd3b
          command: ["python", "/exporter/exporter.py"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          env:
            - name: PZ_LOG_DIR
              value: /pz/data/Logs
            - name: STATE_FILE
              value: /pz/data/exporter/state.json
            - name: SEED_PROMETHEUS_URL
              value: http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zomboid-secrets
                  key: rcon-password
          ports:
            - name: metrics
              containerPort: 9105
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: exporter
              mountPath: /exporter
              readOnly: true
            - name: data
              mountPath: /pz
      volumes:
        - name: scripts
          configMap:
            name: zomboid-config
            items:
              - key: install.sh
                path: install.sh
              - key: start.sh
                path: start.sh
        - name: exporter
          configMap:
            name: zomboid-exporter
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 30Gi
