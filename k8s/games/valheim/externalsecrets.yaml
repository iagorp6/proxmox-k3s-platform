# Senha de entrada: fonte no Bitwarden (item valheim-entrada), publicada no SSM pelo
# scripts/push-secrets-to-ssm.sh. O Valheim exige 5+ caracteres e recusa senha contida no nome do servidor.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valheim-secrets
  namespace: valheim
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: valheim-secrets
    creationPolicy: Owner
  data:
    - secretKey: server-password
      remoteRef:
        key: /homelab/valheim/server-password
