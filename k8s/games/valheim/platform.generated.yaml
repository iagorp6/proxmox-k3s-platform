# Gerado por scripts/render-games.py a partir de game.yaml: não edite à mão.
apiVersion: v1
kind: Service
metadata:
  name: valheim
  namespace: valheim
  labels:
    app.kubernetes.io/name: valheim
    platform.homelab/game: valheim
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: valheim
  ports:
  - name: game
    port: 16261
    targetPort: game
    protocol: UDP
  - name: query
    port: 16262
    targetPort: query
    protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: valheim-metrics
  namespace: valheim
  labels:
    app.kubernetes.io/name: valheim-metrics
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: valheim
  ports:
  - name: metrics
    port: 9105
    targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: valheim
  namespace: valheim
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: valheim-metrics
  endpoints:
  - port: metrics
    interval: 30s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valheim-ingress
  namespace: valheim
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - port: game
      protocol: UDP
    - port: query
      protocol: UDP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: metrics
      protocol: TCP
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valheim-backup
  namespace: valheim
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: valheim-backup
    creationPolicy: Owner
  data:
  - secretKey: RESTIC_REPOSITORY
    remoteRef:
      key: /homelab/backup/restic-repository
  - secretKey: RESTIC_PASSWORD
    remoteRef:
      key: /homelab/backup/restic-password
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: /homelab/backup/restic-aws-access-key-id
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: /homelab/backup/restic-aws-secret-access-key
  - secretKey: AWS_DEFAULT_REGION
    remoteRef:
      key: /homelab/backup/aws-region
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: valheim-backup
  namespace: valheim
spec:
  schedule: 0 5 * * *
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 259200
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: restic
            image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
            command:
            - /bin/sh
            - -c
            args:
            - |
              set -e
              restic backup /data/config --tag valheim --host valheim --retry-lock 10m
              restic forget --tag valheim --host valheim --keep-daily 7 --keep-weekly 4 --retry-lock 10m
              restic snapshots --tag valheim --latest 1
            envFrom:
            - secretRef:
                name: valheim-backup
            env:
            - name: RESTIC_CACHE_DIR
              value: /cache
            - name: TMPDIR
              value: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: data-valheim-0
              readOnly: true
          - name: cache
            emptyDir: {}
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: valheim-restore-drill
  namespace: valheim
spec:
  schedule: 0 7 9 * *
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: valheim-restore-drill
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: restic
            image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
            command:
            - /bin/sh
            - -c
            args:
            - |
              trap 'rm -rf /restore/*' EXIT
              set -eu
              restic snapshots --tag valheim --host valheim --latest 1 --json > /tmp/snap.json
              start=$(date +%s)
              restic restore latest --tag valheim --host valheim --target /restore
              end=$(date +%s)
              [ -n "$(ls -A /restore/data/config 2>/dev/null)" ] || { echo "FALHA: /data/config vazio ou ausente"; exit 1; }
              ls -d /restore/data/config/worlds_local/* >/dev/null 2>&1 || { echo "FALHA: nada casa com data/config/worlds_local/*"; exit 1; }
              bytes=$(( $(du -sk /restore | cut -f1) * 1024 ))
              files=$(find /restore -type f | wc -l)
              snap=$(tr -d '\n' < /tmp/snap.json)
              echo "RESULT {\"restore_seconds\": $((end - start)), \"bytes\": $bytes, \"files\": $files, \"snapshots\": $snap}"
            envFrom:
            - secretRef:
                name: valheim-backup
            env:
            - name: RESTIC_CACHE_DIR
              value: /cache
            - name: TMPDIR
              value: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
            volumeMounts:
            - name: restore
              mountPath: /restore
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: restore
            emptyDir:
              sizeLimit: 20Gi
          - name: cache
            emptyDir: {}
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
