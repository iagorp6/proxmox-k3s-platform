# Gerado por scripts/render-games.py a partir de game.yaml: não edite à mão.
apiVersion: v1
kind: Service
metadata:
  name: terraria
  namespace: terraria
  labels:
    app.kubernetes.io/name: terraria
    platform.homelab/game: terraria
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: terraria
  ports:
  - name: game
    port: 16261
    targetPort: game
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: terraria-metrics
  namespace: terraria
  labels:
    app.kubernetes.io/name: terraria-metrics
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: terraria
  ports:
  - name: metrics
    port: 9105
    targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: terraria
  namespace: terraria
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: terraria-metrics
  endpoints:
  - port: metrics
    interval: 30s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: terraria-ingress
  namespace: terraria
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - port: game
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: metrics
      protocol: TCP
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terraria-backup
  namespace: terraria
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: terraria-backup
    creationPolicy: Owner
  data:
  - secretKey: RESTIC_REPOSITORY
    remoteRef:
      key: /homelab/backup/restic-repository
  - secretKey: RESTIC_PASSWORD
    remoteRef:
      key: /homelab/backup/restic-password
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: /homelab/backup/restic-aws-access-key-id
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: /homelab/backup/restic-aws-secret-access-key
  - secretKey: AWS_DEFAULT_REGION
    remoteRef:
      key: /homelab/backup/aws-region
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: terraria-backup
  namespace: terraria
spec:
  schedule: 45 5 * * *
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 259200
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: terraria-backup
          initContainers:
          - name: save-world
            image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
            command:
            - /bin/sh
            - -c
            args:
            - |
              set -eu
              cd /tmp
              curl -fsSLo kubectl https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
              echo '6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  kubectl' | sha256sum -c -
              chmod +x kubectl
              phase=$(./kubectl -n terraria get pod terraria-0 -o jsonpath='{.status.phase}' 2>/dev/null || true)
              if [ "$phase" = Running ]; then
                ./kubectl -n terraria exec terraria-0 -c server -- sh -c 'echo save > /tmp/console; sleep 15' || echo 'AVISO: save falhou; o backup usa o último autosave'
              else
                echo "terraria-0 não está rodando (${phase:-ausente}): backup do último save em disco"
              fi
            env:
            - name: HOME
              value: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: restic
            image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
            command:
            - /bin/sh
            - -c
            args:
            - |
              set -e
              restic backup /data/worlds /data/tshock --exclude /data/tshock/logs --tag terraria --host terraria --retry-lock 10m
              restic forget --tag terraria --host terraria --keep-daily 7 --keep-weekly 4 --prune --retry-lock 10m
              restic snapshots --tag terraria --latest 1
            envFrom:
            - secretRef:
                name: terraria-backup
            env:
            - name: RESTIC_CACHE_DIR
              value: /cache
            - name: TMPDIR
              value: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: data-terraria-0
              readOnly: true
          - name: cache
            emptyDir: {}
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraria-backup
  namespace: terraria
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraria-backup
  namespace: terraria
rules:
- apiGroups:
  - ''
  resources:
  - pods
  resourceNames:
  - terraria-0
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - pods/exec
  resourceNames:
  - terraria-0
  verbs:
  - get
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraria-backup
  namespace: terraria
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: terraria-backup
subjects:
- kind: ServiceAccount
  name: terraria-backup
  namespace: terraria
