apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: terraria
resources:
  - namespace.yaml
  - externalsecrets.yaml
  - statefulset.yaml
  - service.yaml
  - backup.yaml
patches:
  - path: replicas.yaml   # gerado por scripts/switch-game.py
configMapGenerator:
  - name: terraria-scripts
    files:
      - configure.py=scripts/configure.py
generatorOptions:
  disableNameSuffixHash: true
