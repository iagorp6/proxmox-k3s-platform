# Catálogo da plataforma: o render-games.py gera Service, métricas, backup e o App do Argo CD.
name: minecraft
displayName: Minecraft
status: active
memory: 10Gi
monitoring: rcon
namespace: minecraft
runAsUser: 1000
ports:
  - { name: game, port: 16262, protocol: TCP }
backup:
  schedule: "15 5 * * *"
  pvc: data-minecraft-0
  paths: [/data/world]
  verify: [data/world/level.dat]   # restore drill: o mundo precisa voltar (scripts/restore-drill.py)
metrics: true
switch:
  saveCommand: rcon-cli save-all flush
  joinHint: "Modpack COBBLEVERSE: use o instalador do grupo (install-cobbleverse.ps1), ele baixa a mesma versão que o servidor roda."
