apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app.kubernetes.io/name: minecraft
    platform.homelab/game: minecraft
spec:
  serviceName: minecraft
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft
        platform.homelab/game: minecraft
    spec:
      terminationGracePeriodSeconds: 120   # a imagem salva o mundo e para o servidor no SIGTERM
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: itzg/minecraft-server:java21@sha256:3da0b5e26a3adccc4ed8708f90058e84ebc09fc6f8ced0abc02a1156be656bf7
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE                       # modpack do Modrinth: a imagem instala Fabric + mods
              value: MODRINTH
            - name: MODRINTH_MODPACK
              value: cobbleverse
            - name: MODRINTH_VERSION           # versão fixa: os jogadores precisam da MESMA
              value: 4SKGla61
            - name: MEMORY                     # heap da JVM; o limite do container fica ~2 GiB acima
              value: 6G
            - name: USE_AIKAR_FLAGS
              value: "true"
            - name: MAX_PLAYERS
              value: "6"
            - name: MOTD
              value: "AsunBoid · COBBLEVERSE"
            - name: VIEW_DISTANCE
              value: "8"
            - name: SIMULATION_DISTANCE
              value: "6"
            - name: ONLINE_MODE
              value: "true"
            - name: ENABLE_WHITELIST
              value: "true"
            - name: ENFORCE_WHITELIST
              value: "true"
            - name: WHITELIST
              value: "iagoat,anaodemaleta,vitinho,matarindo,churrasco,cabecudo,plucas"
            - name: OPS
              value: "iagoat"
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-secrets
                  key: rcon-password
            - name: TZ
              value: America/Sao_Paulo
          ports:
            - name: game
              containerPort: 25565
              protocol: TCP
          startupProbe:                        # a primeira subida baixa o modpack inteiro
            exec:
              command: ["mc-health"]
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 15
          livenessProbe:
            exec:
              command: ["mc-health"]
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "1"
              memory: 7Gi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
        - name: exporter
          image: python:3.13-slim@sha256:7c61056e61ac89e852de05f3dc6fa51a6dd2181797bceed46aa725dd7cb2cd3b
          command: ["python", "/scripts/exporter.py"]
          env:
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-secrets
                  key: rcon-password
            - name: STATE_FILE
              value: /data/exporter/state.json
          ports:
            - name: metrics
              containerPort: 9105
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: data
              mountPath: /data/exporter
              subPath: exporter
      volumes:
        - name: scripts
          configMap:
            name: minecraft-scripts
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 15Gi
