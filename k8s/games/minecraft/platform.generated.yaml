# Gerado por scripts/render-games.py a partir de game.yaml: não edite à mão.
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app.kubernetes.io/name: minecraft
    platform.homelab/game: minecraft
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: minecraft
  ports:
  - name: game
    port: 16262
    targetPort: game
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-metrics
  namespace: minecraft
  labels:
    app.kubernetes.io/name: minecraft-metrics
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: minecraft
  ports:
  - name: metrics
    port: 9105
    targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft-metrics
  endpoints:
  - port: metrics
    interval: 30s
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minecraft-backup
  namespace: minecraft
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: minecraft-backup
    creationPolicy: Owner
  data:
  - secretKey: RESTIC_REPOSITORY
    remoteRef:
      key: /homelab/backup/restic-repository
  - secretKey: RESTIC_PASSWORD
    remoteRef:
      key: /homelab/backup/restic-password
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: /homelab/backup/restic-aws-access-key-id
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: /homelab/backup/restic-aws-secret-access-key
  - secretKey: AWS_DEFAULT_REGION
    remoteRef:
      key: /homelab/backup/aws-region
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minecraft-backup
  namespace: minecraft
spec:
  schedule: 15 5 * * *
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: minecraft-backup
          initContainers:
          - name: save-world
            image: curlimages/curl:latest@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
            command:
            - /bin/sh
            - -c
            args:
            - |
              set -eu
              cd /tmp
              curl -fsSLo kubectl https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
              echo '6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  kubectl' | sha256sum -c -
              chmod +x kubectl
              phase=$(./kubectl -n minecraft get pod minecraft-0 -o jsonpath='{.status.phase}' 2>/dev/null || true)
              if [ "$phase" = Running ]; then
                ./kubectl -n minecraft exec minecraft-0 -c server -- rcon-cli save-all flush || echo 'AVISO: save falhou; o backup usa o último autosave'
              else
                echo "minecraft-0 não está rodando (${phase:-ausente}): backup do último save em disco"
              fi
            env:
            - name: HOME
              value: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: restic
            image: restic/restic:latest@sha256:9940e6c7421ab3a21ee9fdc4e91596d04c792b600d31b102696c75cbf3ac4481
            command:
            - /bin/sh
            - -c
            args:
            - |
              set -e
              restic backup /data/world --tag minecraft --host minecraft --retry-lock 10m
              restic forget --tag minecraft --host minecraft --keep-daily 7 --keep-weekly 4 --prune --retry-lock 10m
              restic snapshots --tag minecraft --latest 1
            envFrom:
            - secretRef:
                name: minecraft-backup
            env:
            - name: RESTIC_CACHE_DIR
              value: /cache
            - name: TMPDIR
              value: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: data-minecraft-0
              readOnly: true
          - name: cache
            emptyDir: {}
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minecraft-backup
  namespace: minecraft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minecraft-backup
  namespace: minecraft
rules:
- apiGroups:
  - ''
  resources:
  - pods
  resourceNames:
  - minecraft-0
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - pods/exec
  resourceNames:
  - minecraft-0
  verbs:
  - get
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minecraft-backup
  namespace: minecraft
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: minecraft-backup
subjects:
- kind: ServiceAccount
  name: minecraft-backup
  namespace: minecraft
